@media (min-width:700px){.shell{padding-top:34px}.nav{border-radius:22px 22px 0 0}}
/* Hromadny vyber polozek prehledne podle kategorii */
.shellManage{padding-bottom:calc(185px + env(safe-area-inset-bottom))}
.manageCategoryList{display:grid;gap:9px;margin-top:12px;padding-bottom:20px}
.manageCategory{border:1px solid #edf0f2;border-left-width:4px;border-radius:17px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.manageCategoryHead{width:100%;border:0;background:#fff;color:var(--text);display:flex;align-items:center;gap:11px;text-align:left;padding:14px 12px;min-height:73px;cursor:pointer}
.manageCategoryHead:active{background:#f7fbf9}
.manageCategoryIcon{width:41px;height:41px;background:#f1f5f9;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none}
.manageCategoryText{flex:1;min-width:0}
.manageCategoryTitle{display:block;font-size:16px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.manageCategoryCount{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.manageCategoryChosen{font-size:11px;font-weight:800;background:var(--green2);color:#17795a;padding:5px 8px;border-radius:999px;white-space:nowrap}
.manageCategoryChevron{font-size:22px;color:#94a3b8;line-height:1;min-width:16px;text-align:center}
.manageCategoryBody{border-top:1px solid #edf0f2;background:#fff}
.manageCategoryTools{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 13px;background:#fbfcfc;border-bottom:1px solid #edf0f2}
.manageCategoryTools .smallLabel{margin:0}
.manageCategoryTools button{border:1px solid #cde8df;background:#f0faf6;color:#157a59;padding:9px 10px;border-radius:12px;font-size:12px;font-weight:800;cursor:pointer}
.manageItem .manageInfo{display:block;border:0;background:transparent;text-align:left;font-weight:400;cursor:pointer;color:var(--text);font-size:inherit}
.manageItem .manageOpen{border:0;background:transparent;color:#94a3b8;font-size:24px;min-width:36px;min-height:44px;cursor:pointer;flex:none}
.manageItemSelected{background:#f4fbf8}
.manageItem .itemTitle{overflow-wrap:anywhere}
.manageEmpty{padding:18px 14px;color:var(--muted);font-size:13px}
.manageStrip{margin-top:16px;border-top:1px solid #e8edef;padding-top:8px}
.manageStripToggle{width:100%;border:0;background:transparent;color:#64748b;text-align:left;display:flex;align-items:center;justify-content:space-between;padding:10px 2px;font-size:13px;font-weight:800;cursor:pointer}
.manageStrip .manageCategoryList{margin-top:5px}
.manageAdvanced .manageToolbar{margin:8px 0 0}
.manageAdvanced .manageToolbar .danger{font-size:13px}

/* Hlasove zadavani sdili stejny formular i nahled jako rucni zapis. */
.action{cursor:pointer;min-height:100px;-webkit-tap-highlight-color:transparent}
.action:focus-visible,.voiceKeyboardHelp:focus-visible{outline:3px solid #2fa37c;outline-offset:3px}
.action.voiceListening{border-color:#2fa37c;background:linear-gradient(135deg,#eaf9f2,#fff)}
.action.voiceListening .voiceGlyph{display:inline-block;animation:voiceBeat 1.2s ease-in-out infinite}
.voiceMessage{min-height:21px;color:#64748b;line-height:1.35;font-size:13px;margin:11px 2px 0}
.voiceMessage.listening{color:#147754;font-weight:750}
.voiceMessage.warning{color:#a15116}
.voiceKeyboardHelp{display:inline-block;border:0;background:transparent;color:#147754;font-weight:750;text-decoration:underline;text-underline-offset:3px;padding:5px 2px;font-size:12px;cursor:pointer}
@keyframes voiceBeat{50%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){.action.voiceListening .voiceGlyph{animation:none}}
.categoryArchive{margin-top:18px;margin-bottom:12px;border-top:1px solid #e7ecef;padding-top:7px}
.categoryArchiveToggle{width:100%;padding:12px 5px;border:0;background:transparent;display:flex;justify-content:space-between;align-items:center;color:#64748b;font-size:13px;font-weight:800;text-align:left}
.categoryArchiveRows{border:1px solid #e7ecef;background:#fff;border-radius:16px;overflow:hidden;margin:5px 0 16px}
.categoryArchiveItem{display:flex;width:100%;align-items:center;text-align:left;gap:10px;border:0;border-bottom:1px solid #edf1f2;background:#fff;color:#1c293d;padding:13px 11px}
.categoryArchiveItem:last-child{border-bottom:0}.categoryArchiveCheck{color:#168660;font-size:19px;font-weight:900}
.categoryArchiveMain{flex:1;min-width:0;display:grid;gap:3px}.categoryArchiveMain strong{font-size:13px;line-height:1.3}.categoryArchiveMain small{font-size:11px;color:#64748b}
/* Chytrá historie: aktivní část zůstává před sbaleným archivem. */
.historyPane{border:1px solid #e6ecea;background:#fff;border-radius:18px;padding:14px;margin:7px 0 18px;box-shadow:var(--shadow)}
.historyPane h3{margin:4px 0 10px;font-size:14px;color:#526579;letter-spacing:.01em}
.historyPaneNote{font-size:12px;line-height:1.5;color:#64748b;margin:10px 0}
.historyFind{display:block;width:100%;padding:12px 13px;border:1px solid #dfe5e8;background:#fbfdfc;border-radius:13px;font-size:15px;outline:none;margin:3px 0 13px}
.historyFind:focus{border-color:#7ecbab;box-shadow:0 0 0 3px #e8f7f1}

<body>
  <div id="app"></div>
  <script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=d=>new Intl.DateTimeFormat('cs-CZ').format(new Date(d));
const dayMs=86400000;
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
function vehicleTopicFromText(text){const l=String(text||'').toLowerCase();
  if(/\bstk\b|technick(?:á|ou|é)?\s+kontrol/.test(l))return'STK';
  if(/servis|výměn.*olej|olej|brzd|rozvod/.test(l))return'Servis';
  if(/pojištěn[ií]/.test(l))return'Pojištění';
  if(/pneumatik|přez|prez/.test(l))return'Pneumatiky';
  if(/dálniční\s+známk|dalnicni\s+znamk/.test(l))return'Dálniční známka';
  if(/emis/.test(l))return'Emise';
  return null
}
function vehicleEntityFromText(text){const t=String(text||'');const l=t.toLowerCase();
  const branded=t.match(/\b(Audi|BMW|Mercedes(?:-Benz)?|Škoda|Skoda|Volkswagen|VW|Volvo|MAN|Ford|Toyota|Honda|Yamaha|Kia|Hyundai|Peugeot|Renault|Citroën|Citroen|Opel|Tesla)\s+([A-Za-z0-9-]+)/i);
  if(branded)return `${branded[1]} ${branded[2]}`;
  if(/pracovn(?:í|ího|ímu|ím)\s+(?:auto|auta|vůz|vuz|vozu|vozidlo|vozidla)|služebn(?:í|ího|ímu|ím)\s+(?:auto|auta|vůz|vuz|vozu|vozidlo|vozidla)|firemn(?:í|ího|ímu|ím)\s+(?:auto|auta|vůz|vuz|vozu|vozidlo|vozidla)/.test(l))return'Pracovní auto';
  if(/motork|motocykl/.test(l))return'Motorka';
  if(/skútr|skutr/.test(l))return'Skútr';
  if(/dodávk|dodavk/.test(l))return'Dodávka';
  if(/kamion|nákladn[ií]\s+(?:auto|vůz|vuz|vozidlo)/.test(l))return'Nákladní auto';
  if(/přívěs|prives/.test(l))return'Přívěs';
  if(/návěs|naves/.test(l))return'Návěs';
  if(/traktor/.test(l))return'Traktor';
  if(/\bauto\b|\bauta\b|automobil|\bvůz\b|\bvuz\b|\bvozu\b|vozidlo|vozidla/.test(l))return'Auto';
  return null
}

const BUILTIN_AREAS=['Já','Rodina','Ben','Vozidla','Zdraví','Dům','Smlouvy','Práce','Finance','Domácnost','Zahrada','Poukazy'];
const BUILTIN_DEFAULTS={
  'Já':{label:'Já',emoji:'👤',color:'#64748b',keywords:[]},
  'Rodina':{label:'Rodina',emoji:'👨‍👩‍👧',color:'#ec4899',keywords:[]},
  'Ben':{label:'Mazlíčci',emoji:'🐾',color:'#14b8a6',keywords:[]},
  'Vozidla':{label:'Vozidla',emoji:'🚗',color:'#3b82f6',keywords:[]},
  'Zdraví':{label:'Zdraví',emoji:'🩺',color:'#ef4444',keywords:[]},
  'Dům':{label:'Dům',emoji:'🏠',color:'#f59e0b',keywords:[]},
  'Smlouvy':{label:'Smlouvy',emoji:'📄',color:'#8b5cf6',keywords:[]},
  'Práce':{label:'Práce',emoji:'💼',color:'#3b82f6',keywords:[]},
  'Finance':{label:'Finance',emoji:'📈',color:'#2fa37c',keywords:[]},
  'Domácnost':{label:'Domácnost',emoji:'🛒',color:'#14b8a6',keywords:[]},
  'Zahrada':{label:'Zahrada',emoji:'🌿',color:'#2fa37c',keywords:[]},
  'Poukazy':{label:'Poukazy',emoji:'🎁',color:'#f59e0b',keywords:[]}
};
const CATEGORY_COLORS=['#2fa37c','#3b82f6','#8b5cf6','#f59e0b','#ef4444','#64748b','#ec4899','#14b8a6'];
function loadCustomAreas(){try{const x=JSON.parse(localStorage.getItem('projectD-custom-areas')||'[]');return Array.isArray(x)?x:[]}catch{return[]}}
function loadBuiltinSettings(){try{const x=JSON.parse(localStorage.getItem('projectD-builtin-area-settings')||'{}');return x&&typeof x==='object'?x:{}}catch{return{}}}
function loadLearning(){try{const x=JSON.parse(localStorage.getItem('projectD-learning')||'{}');return x&&typeof x==='object'?x:{}}catch{return{}}}
let customAreas=loadCustomAreas();
let builtinSettings=loadBuiltinSettings();
let learning=loadLearning();
// Samostatna preference - meni jen poradi karet, nikdy data v kategoriich.
function loadCategoryOrder(){try{const v=JSON.parse(localStorage.getItem('projectD-category-order-v1')||'[]');return Array.isArray(v)?[...new Set(v.filter(x=>typeof x==='string'))]:[]}catch{return[]}}
let categoryOrder=loadCategoryOrder();
function sortedCategoryAreas(areas){
  const positions=new Map(categoryOrder.map((a,i)=>[a,i]));
  return areas.map((area,i)=>({area,i})).sort((a,b)=>
    (positions.has(a.area)?positions.get(a.area):categoryOrder.length+a.i)-
    (positions.has(b.area)?positions.get(b.area):categoryOrder.length+b.i)
  ).map(x=>x.area);
}
function saveCategoryOrder(){try{localStorage.setItem('projectD-category-order-v1',JSON.stringify(categoryOrder))}catch{}}
function updateCategoryOrder(visibleOrdered){
  const visible=new Set(visibleOrdered);
  const all=sortedCategoryAreas(allAreas({includeHidden:true}));
  let i=0;
  // Skryte polozky zustavaji na svych mistech, aby se po obnoveni vratily do poradi.
  categoryOrder=all.map(a=>visible.has(a)?visibleOrdered[i++]:a);
  saveCategoryOrder();
}

if(!learning.areaTokens)learning.areaTokens={};
if(!learning.personAreas)learning.personAreas={};
function savePersonalization(){try{localStorage.setItem('projectD-custom-areas',JSON.stringify(customAreas));localStorage.setItem('projectD-builtin-area-settings',JSON.stringify(builtinSettings));localStorage.setItem('projectD-learning',JSON.stringify(learning))}catch{}}
function isBuiltinArea(area){return BUILTIN_AREAS.includes(area)}
function builtinAreaConfig(area){const d=BUILTIN_DEFAULTS[area]||{label:area,emoji:'●',color:CATEGORY_COLORS[0],keywords:[]};const u=builtinSettings[area]||{};return{label:u.label||d.label,emoji:u.emoji||d.emoji,color:u.color||d.color,keywords:Array.isArray(u.keywords)?u.keywords:[],hidden:!!u.hidden}}
function customAreaByName(name){return customAreas.find(c=>c.name===name)||null}
function areaLabel(area){return isBuiltinArea(area)?builtinAreaConfig(area).label:(customAreaByName(area)?.name||area)}
function areaEmoji(area){return isBuiltinArea(area)?builtinAreaConfig(area).emoji:(customAreaByName(area)?.emoji||'●')}
function areaColor(area){return isBuiltinArea(area)?builtinAreaConfig(area).color:(customAreaByName(area)?.color||CATEGORY_COLORS[0])}
function areaHidden(area){return isBuiltinArea(area)?builtinAreaConfig(area).hidden:!!customAreaByName(area)?.hidden}
function allAreas(opts={}){const includeHidden=!!opts.includeHidden;const builtins=BUILTIN_AREAS.filter(a=>includeHidden||!areaHidden(a));const customs=customAreas.filter(c=>includeHidden||!c.hidden).map(c=>c.name).filter(n=>n&&!BUILTIN_AREAS.includes(n));return[...builtins,...customs]}
function hiddenBuiltinAreas(){return BUILTIN_AREAS.filter(areaHidden)}
function hiddenAreas(){return[...BUILTIN_AREAS.filter(areaHidden),...customAreas.filter(c=>c.hidden).map(c=>c.name)]}
function fallbackArea(){return allAreas()[0]||'Já'}
function normalizedText(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function customAreaFromKeywords(text){
  const hay=normalizedText(text);let best=null,bestScore=0;
  for(const area of BUILTIN_AREAS){if(areaHidden(area))continue;const c=builtinAreaConfig(area);const kws=[...(c.keywords||[])];if(c.label&&c.label!==area)kws.push(c.label);const score=kws.map(normalizedText).filter(Boolean).reduce((n,k)=>n+(hay.includes(k)?1:0),0);if(score>bestScore){best=area;bestScore=score}}
  for(const c of customAreas){if(c.hidden)continue;const kws=[...(c.keywords||[]),c.name].map(normalizedText).filter(Boolean);const score=kws.reduce((n,k)=>n+(hay.includes(k)?1:0),0);if(score>bestScore){best=c.name;bestScore=score}}
  return bestScore>0?best:null
}
function meaningfulTokens(text){
  const stop=new Set(['jsem','jsi','jsme','jste','bude','budu','budes','být','byt','mam','mám','musim','musím','chci','potrebuji','potřebuji','dnes','zítra','zitra','pozítří','pozitri','tento','tahle','tohle','něco','neco','prosím','prosim','pak','ještě','jeste','aby','jako','který','ktera','která','které','ktere','když','kdyz','do','na','ve','od','za','pro','se','si','mi','mu','ho','ji','a','i','v','z','s','u','k','ke','zavolat','volat','napsat','poslat','domluvit','objednat','pripomen','pripomenout','zkontrolovat','zapsat','zavolani','telefonat','hovor','vecer','rano','odpoledne','dopoledne']);
  return [...new Set(String(text||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[^a-z0-9]+/).filter(w=>w.length>=3&&!stop.has(w)))].slice(0,12)
}
function customAreaFromKeywords(text){
  const hay=String(text||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  let best=null,bestScore=0;
  for(const c of customAreas){
    if(c.hidden)continue;
    const kws=(c.keywords||[]).map(k=>String(k).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')).filter(Boolean);
    const score=kws.reduce((n,k)=>n+(hay.includes(k)?1:0),0);
    if(score>bestScore){best=c.name;bestScore=score}
  }
  return bestScore>0?best:null
}
function learnedAreaFromText(text){
  const scores={};
  for(const tok of meaningfulTokens(text)){
    const row=learning.areaTokens[tok]||{};
    for(const [area,count] of Object.entries(row))scores[area]=(scores[area]||0)+count;
  }
  const ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  if(!ranked.length)return null;
  const [area,score]=ranked[0],second=ranked[1]?.[1]||0;
  return score>=3&&score>=second+1&&allAreas().includes(area)?area:null
}
function learnAreaChoice(text,chosenArea,previousArea){
  if(!chosenArea||chosenArea===previousArea)return;
  for(const tok of meaningfulTokens(text)){
    learning.areaTokens[tok]??={};
    learning.areaTokens[tok][chosenArea]=(learning.areaTokens[tok][chosenArea]||0)+1;
  }
  savePersonalization();
}

// Jmena lidi nejsou pevne zadratovana do aplikace. Uzivatel nemusi zakladat profily.
// Pokud jedna konkretni osoba dostane pri oprave kategorii, pamatuje si ji pro priste.
const PERSON_IGNORED=new Set(['Zavolat','Napsat','Poslat','Domluvit','Objednat','Připomeň','Připomenout','Zkontrolovat','Zaplatit','Čekám','Zapsat','Dnes','Zítra','Pozítří','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota','Neděle','Lednu','Únoru','Březnu','Dubnu','Květnu','Červnu','Červenci','Srpnu','Září','Říjnu','Listopadu','Prosinci','Rodina','Práce','Finance','Já','Internet','Smlouva','Koupit','Připravit','Stříhání','Očkování','STK','BMW','Octavia','Auto','Banky']);
function personKey(name){
  let n=normalizedText(name).replace(/[^a-z]/g,'');
  if(n.length<3)return'';
  // Bezpecne, casto pouzivane pady muzskych jmen: Lubosovi/Lubosem, Petrovi/Petrem.
  if(n.endsWith('ovi')&&n.length>=6)n=n.slice(0,-3);
  else if(n.endsWith('em')&&n.length>=6)n=n.slice(0,-2);
  else if(n.endsWith('e')&&n.length>=6&&/[szc]e$/.test(n))n=n.slice(0,-1);
  return n;
}
function candidatePeople(text){
  const raw=String(text||'');
  const words=[...raw.matchAll(/(?:^|[\s,;:])([A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ][a-záčďéěíňóřšťúůýž]{2,})(?=$|[\s,;:.!?])/gu)];
  return [...new Set(words.map(m=>m[1]).filter(w=>!PERSON_IGNORED.has(w)).map(personKey).filter(Boolean))];
}
function explicitHumanRelation(text){
  const t=normalizedText(text);
  if(/\b(?:partner|partnera|partnerovi|partnerkou|partnerce|manzel|manzelka|pritel|pritelem|pritelkyn|mamce|tata|mamink|bratr|sestra|synovi|dcera|rodice)/.test(t))return'Rodina';
  if(/\b(?:koleg|kolegy|kolegov|sef|zamestnavatel|pracovn|zakaznik)/.test(t))return'Práce';
  if(/\b(?:kamarad|kamos|kamoska|kamarád)/.test(t))return'Já';
  return null;
}
function specificTopicOverride(text){
  const t=normalizedText(text);
  // Silnejsi zamer ukolu ma prednost pred vztahem s osobou.
  if(/\b(?:prace|praci|pracovni|zakaznik|firma|faktura|nabidka|schuzka s kolegou)/.test(t))return'Práce';
  if(/\b(?:smlouva|smlouvu|internet|tarif|dodavatel)/.test(t))return'Smlouvy';
  if(/\b(?:hypotek|hypotec|banka|uver|ucet|rozpocet)/.test(t))return'Finance';
  return null;
}
function rememberedPersonArea(text){
  const xs=candidatePeople(text),found=[...new Set(xs.map(k=>learning.personAreas[k]).filter(Boolean))];
  return found.length===1 && allAreas().includes(found[0])?found[0]:null;
}
function rememberPeople(text,area,wasCorrected){
  if(!area||!allAreas({includeHidden:true}).includes(area))return;
  const relation=explicitHumanRelation(text);
  const people=candidatePeople(text);
  // Vyzaduje bud vylozeny kontext (partner, kamaradka, kolega), nebo opravu uzivatele.
  if(!(wasCorrected||relation===area))return;
  for(const p of people)learning.personAreas[p]=area;
  if(people.length)savePersonalization();
}

function normalizeItem(x){
  if(!x||typeof x!=='object')return x;
  const text=`${x.title||''} ${x.raw||''}`;
  if(x.area==='Auto'){
    const oldEntity=x.entity;
    x.area='Vozidla';
    if(!x.topic&&['STK','Servis','Pojištění','Pneumatiky','Emise','Dálniční známka'].includes(oldEntity))x.topic=oldEntity;
    if(['STK','Servis','Pojištění','Pneumatiky','Emise','Dálniční známka'].includes(oldEntity))x.entity=vehicleEntityFromText(text)||'Auto';
    else x.entity=x.entity||vehicleEntityFromText(text)||'Auto';
    x.topic=x.topic||vehicleTopicFromText(text);
  }else if(x.area==='Vozidla'){
    x.entity=x.entity||vehicleEntityFromText(text)||'Vozidlo';
    x.topic=x.topic||vehicleTopicFromText(text);
  }
  x.icon=iconFor(x.kind,x.area);
  return x
}
function normalizeItems(xs){return Array.isArray(xs)?xs.map(normalizeItem):xs}
// Prepis reci se neprenasi na nas server ani se neuklada zvuk. Browser muze vyuzit svou sluzbu rozpoznavani.
const voiceInput={recognition:null,session:0,active:false,starting:false,stopping:false,prefix:'',finalText:'',interimText:'',message:'Nadiktovaný text si před uložením zkontroluj.',warning:false,startTimer:null};
function voiceConstructor(){return window.SpeechRecognition||window.webkitSpeechRecognition||null}
function voiceStatus(message,warning=false){
  voiceInput.message=message;voiceInput.warning=warning;
  const label=$('#voiceButtonLabel'),hint=$('#voiceButtonHint'),btn=$('#voiceButton'),msg=$('#voiceMessage');
  if(btn){btn.classList.toggle('voiceListening',voiceInput.active);btn.setAttribute('aria-pressed',voiceInput.active?'true':'false')}
  if(label)label.textContent=voiceInput.active?'Zastavit':'Namluvit';
  if(hint)hint.textContent=voiceInput.active?'poslouchám česky':'hlasové zadání';
  if(msg){msg.textContent=message;msg.className='voiceMessage'+(voiceInput.active?' listening':warning?' warning':'')}
}
function updateAddDraftFromInput(value){
  state.addText=value;
  state.addDraft=value.trim()?parseMany(value.trim()):[];
  const textarea=$('#newText');if(textarea&&textarea.value!==value)textarea.value=value;
  const p=$('#preview');if(p){p.innerHTML=state.addDraft.length?previewMany(state.addDraft):'';bindPreviewDraft()}
}
function speechTextWithPrefix(speech){
  const prefix=voiceInput.prefix||'';if(!speech.trim())return prefix;
  return prefix+(prefix.trim()&&!/\n$/.test(prefix)?'\n':'')+speech.trim();
}
function haltVoiceOnNavigation(){
  if(!voiceInput.recognition&&!voiceInput.active&&!voiceInput.starting)return;
  voiceInput.session++;
  clearTimeout(voiceInput.startTimer);voiceInput.startTimer=null;
  const r=voiceInput.recognition;
  voiceInput.recognition=null;voiceInput.active=false;voiceInput.starting=false;voiceInput.stopping=false;
  if(r){try{r.abort()}catch(e){}}
}
function focusVoiceKeyboard(message='Na klávesnici telefonu klepni na mikrofon. Nadiktovaný text se objeví v poli a D ho zpracuje stejně jako psaní.'){
  voiceStatus(message,true);
  const t=$('#newText');if(t){t.focus();try{t.setSelectionRange(t.value.length,t.value.length)}catch(e){}}
}
function stopVoiceInput(){
  if(!voiceInput.recognition||voiceInput.stopping)return;
  voiceInput.stopping=true;
  voiceStatus('Dokončuji přepis. Počkej chvilku…');
  try{voiceInput.recognition.stop()}catch(e){voiceInput.stopping=false;voiceInput.active=false;voiceStatus('Nahrávání zastaveno. Zkontroluj text před uložením.')}
}
function beginVoiceInput(){
  if(voiceInput.active||voiceInput.starting){stopVoiceInput();return}
  const Constructor=voiceConstructor();
  if(!Constructor){focusVoiceKeyboard('Tento prohlížeč neumí přímo přepisovat řeč. Použij mikrofon na klávesnici telefonu.');return}
  // start() musi byt primo v reakci na klepnuti; prohlizec pak vyzada opravneni.
  let recognition;try{recognition=new Constructor()}catch(e){focusVoiceKeyboard();return}
  const session=++voiceInput.session;
  voiceInput.recognition=recognition;voiceInput.prefix=state.addText;
  voiceInput.finalText='';voiceInput.interimText='';voiceInput.active=true;voiceInput.starting=true;voiceInput.stopping=false;
  recognition.lang='cs-CZ';recognition.continuous=false;recognition.interimResults=true;recognition.maxAlternatives=1;
  recognition.onstart=()=>{if(session!==voiceInput.session)return;voiceInput.starting=false;clearTimeout(voiceInput.startTimer);voiceInput.startTimer=null;voiceStatus('🎙️ Poslouchám. Mluv česky; po pauze se text doplní.')};
  recognition.onresult=e=>{
    if(session!==voiceInput.session||state.tab!=='add')return;
    let confirmed=[],interim=[];
    for(let i=0;i<e.results.length;i++){const result=e.results[i],part=String(result?.[0]?.transcript||'').trim();if(part)(result.isFinal?confirmed:interim).push(part)}
    voiceInput.finalText=confirmed.join(' ');voiceInput.interimText=interim.join(' ');
    const combined=[voiceInput.finalText,voiceInput.interimText].filter(Boolean).join(' ');
    if(combined)updateAddDraftFromInput(speechTextWithPrefix(combined));
    voiceStatus(voiceInput.finalText?'Text rozpoznán. Zkontroluj ho, případně dopiš další větu.':'🎙️ Poslouchám… Přepisuji zadání.');
  };
  recognition.onerror=e=>{
    if(session!==voiceInput.session)return;
    clearTimeout(voiceInput.startTimer);voiceInput.startTimer=null;
    const err=e?.error||'';
    if(err==='aborted')return;
    voiceInput.starting=false;
    if(err==='no-speech'){voiceStatus('Nic jsem nezachytila. Zkus to znovu nebo použij diktování klávesnice.',true);return}
    if(err==='not-allowed'||err==='service-not-allowed'){voiceStatus('Rozpoznávání řeči nemá povolení nebo není dostupné. Použij mikrofon na klávesnici telefonu.',true);return}
    if(err==='network'){voiceStatus('Služba rozpoznávání není dostupná. Zkus to znovu nebo mikrofon na klávesnici telefonu.',true);return}
    voiceStatus('Přímé rozpoznávání se nepodařilo. Můžeš použít mikrofon na klávesnici telefonu.',true);
  };
  recognition.onend=()=>{
    if(session!==voiceInput.session)return;
    clearTimeout(voiceInput.startTimer);voiceInput.startTimer=null;

function splitInput(text){

function getTodayBuckets(){

  const shopping=active.filter(x=>x.kind==='shopping');

function isLegacyHistoryBridge(x){
  if(x.status!=='done'||x.workflow!=='appointment'||x.appointmentStage!=='scheduled'||!x.parentId)return false;

function historyActivityType(x){
  if(x.kind!=='watch'&&x.kind!=='voucher')return null;

  if(/ockovan/.test(t))return 'Očkování';

function historyLatestGroups(archived){
  const groups=new Map();
  for(const x of archived){
    const type=historyActivityType(x);if(!type)continue;
    const key=`${normalizedText(x.entity||'')}/${type}/${normalizedText(x.topic||'')}`;
    if(!groups.has(key))groups.set(key,{items:[],type});
    groups.get(key).items.push(x);
  }
  return [...groups.values()].map(({items,type})=>{
    // Skutečné potvrzené datum má přednost před dnem odškrtnutí.
    const confirmed=items.filter(x=>x.actualDate).sort((a,b)=>Date.parse(b.actualDate)-Date.parse(a.actualDate));
    return {x:confirmed[0]||items[0],type};
  }).sort((a,b)=>Date.parse(b.x.actualDate||b.x.completedAt||0)-Date.parse(a.x.actualDate||a.x.completedAt||0)).slice(0,3);
}

    html+=list.map(([key,records])=>{const max=state.historyMonthLimits[key]||30;return `<details class="historyMonth"><summary>${esc(historyMonthName(key))} (${records.length})</summary><div>${records.slice(0,max).map(historyItemHtml).join('')}${records.length>max?`<button type="button" class="historyArchiveLink" data-history-month-more="${esc(key)}">Zobrazit další v měsíci (${records.length-max})</button>`:''}</div></details>`}).join('');
    if(months.size>state.categoryHistoryMonths)html+=`<button type="button" class="historyArchiveLink" data-history-more-months="1">Další měsíce (${months.size-state.categoryHistoryMonths}) ↓</button>`;
  }

function addMonthsFrom(base,n){const d=new Date(base||new Date());const day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()!==day)d.setDate(0);return d}
function addYearsFrom(base,n){const d=new Date(base||new Date());d.setFullYear(d.getFullYear()+n);return d}
function addDaysFrom(base,n){const d=new Date(base||new Date());d.setDate(d.getDate()+n);return d}
function nextSpringFrom(base){const b=new Date(base||new Date());return new Date(b.getFullYear()+1,2,1,12,0,0,0)}
function textOf(x){const title=displayTitle(x);return (x.origin==='followup'||/^Návaznost na:/i.test(x.raw||'')?title:`${title} ${x.raw||''}`).toLowerCase()}

function isAppointmentBooking(x){
  if(!x||x.kind==='shopping'||x.kind==='voucher')return false;
  const l=textOf(x);
  return /objednat\s+se\b/.test(l)
    || /objednat\b.*\b(?:na|k|ke)\b/.test(l)
    || /objednat\s+(?:stříhání|očkování|veterináře|návštěvu|termín)\b/.test(l)
    || /domluvit\s+(?:si\s+)?term[ií]n/.test(l)
    || /rezervovat\s+(?:si\s+)?term[ií]n/.test(l);
}
function appointmentTopicFromItem(x){
  const l=textOf(x);
  if(/kadeř|holič/.test(l))return'Kadeřník';
  if(/zubař|dent/.test(l))return'Zubař';
  if(/doktor|lékař|ordinac|praktik|dermatolog|fyzi|rehab/.test(l))return'Lékař';
  if(/stříh|groom/.test(l))return'Stříhání';
  if(/očkov/.test(l))return'Očkování';
  if(/veterin/.test(l))return'Veterina';
  if(/servis/.test(l))return'Servis';
  return x.topic||x.entity||'Termín';
}
function appointmentTitleFromItem(x){
  const topic=appointmentTopicFromItem(x);
  if(x.area===PET_AREA){
    const name=x.entity&&x.entity!=='Ben'?x.entity:null;
    if(topic==='Stříhání')return name?`Stříhání – ${name}`:'Stříhání mazlíčka';
    if(topic==='Očkování')return name?`Očkování – ${name}`:'Očkování mazlíčka';
    if(topic==='Veterina'||topic==='Lékař')return name?`Veterinář – ${name}`:'Veterinář';
  }
  if(x.area==='Vozidla'&&topic==='Servis')return x.entity&&x.entity!=='Vozidlo'?`Servis – ${x.entity}`:'Servis vozidla';
  if(['Kadeřník','Zubař','Lékař','Servis'].includes(topic))return topic;
  let t=displayTitle(x).replace(/^Objednat(?:\s+se)?\s*/i,'').trim();
  return t?`Termín – ${t}`:'Domluvený termín';
}
function appointmentDoneLabel(x){
  const l=textOf(x);
  if(x.area==='Ben'&&/stříh/.test(l))return'Ostříháno';
  if(x.area==='Ben'&&/očkov/.test(l))return'Očkováno';
  if(x.area==='Zdraví')return'Absolvováno';
  if(/kadeř|holič/.test(l))return'Hotovo';
  if(x.area==='Vozidla'&&/servis/.test(l))return'Hotovo';
  return'Hotovo';
}

function routineKey(x){
  const l=textOf(x),entity=(x.entity||'').toLowerCase();
  if(/kadeř|holič/.test(l))return'ja|kadernik';
  if(x.area===PET_AREA&&/stříh/.test(l))return`mazlicci|${normalizedText(x.entity||'neznamy')}|strihani`;
  if(x.area===PET_AREA&&/(vykoupat|koupat|koupání|koupani|umýt|umyt)/.test(l))return`mazlicci|${normalizedText(x.entity||'neznamy')}|koupani`;
  if(x.area==='Vozidla'&&/(umýt|umyt|mytí|myti|myčka|mycka)/.test(l))return`vozidla|${entity}|myti`;
  if(x.area==='Zdraví'&&/zubař|dent/.test(l))return'zdravi|zubar';
  if(x.area==='Zahrada'&&/levand/.test(l))return'zahrada|levandule';
  const words=meaningfulTokens(displayTitle(x)).filter(w=>!['objednat','zavolat','zkontrolovat','hotovo','udelat','udělat','pripomenout','připomenout'].includes(w)).slice(0,5);
  return `${x.area}|${entity}|${words.join('-')}`;
}
function routineEventDate(x){return new Date(x.due||x.completedAt||x.created||0)}
function median(nums){const a=[...nums].sort((a,b)=>a-b),n=a.length;if(!n)return null;return n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2}
function formatCadence(days){
  if(days>=45){const m=Math.max(2,Math.round(days/30.44));return m===12?'zhruba rok':`zhruba ${m} měsíce`}
  if(days>=12){const w=Math.max(2,Math.round(days/7));return`zhruba ${w} týdny`}
  return days===1?'každý den':`zhruba každých ${Math.round(days)} dní`
}
function recurrenceSuggestion(x){
  const key=routineKey(x);if(!key)return null;
  const dates=state.items.filter(i=>i.status==='done'&&routineKey(i)===key).map(routineEventDate).filter(d=>!Number.isNaN(d.getTime())).sort((a,b)=>a-b);
  if(dates.length<3)return null;
  const gaps=[];for(let i=1;i<dates.length;i++){const g=Math.round((dates[i]-dates[i-1])/dayMs);if(g>0)gaps.push(g)}
  if(gaps.length<2)return null;
  const med=median(gaps);if(!med||med<1)return null;
  const maxDev=Math.max(...gaps.map(g=>Math.abs(g-med)/med));
  if(maxDev>0.45)return null;
  return{type:'learned_recurrence',title:'Vypadá to na pravidelný rytmus',text:`Podle ${dates.length} dokončených záznamů se to opakuje ${formatCadence(med)}. Chceš, aby to D příště pohlídalo?`,intervalDays:Math.max(1,Math.round(med))};
}

function actionProfile(x){
  const l=textOf(x);
  if(x.kind==='shopping')return{primary:null,secondary:null};
  if(x.workflow==='appointment'&&x.appointmentStage==='scheduled'){
    return{primary:appointmentDoneLabel(x),secondary:'Změnit termín',secondaryMode:'reschedule'};
  }
  if(isAppointmentBooking(x)){
    return{primary:'Objednáno',secondary:'Odložit',secondaryMode:'defer'};
  }
  if(x.kind==='waiting'){
    if(x.area==='Vozidla'&&(x.topic==='Servis'||/servis/.test(l)))return{primary:'Ozvali se',secondary:'Ještě čekám',secondaryMode:'defer'};
    return{primary:'Vyřešeno',secondary:'Ještě čekám',secondaryMode:'defer'};
  }
  if(x.kind==='voucher')return{primary:'Použito',secondary:'Připomenout později',secondaryMode:'defer'};
  if(x.kind==='watch'){
    const learned=recurrenceSuggestion(x);if(learned)return learned;
  if(x.area==='Ben'&&/stříh/.test(l))return{primary:'Ostříháno',secondary:'Připomenout později',secondaryMode:'defer'};
  if(x.area==='Ben'&&/očkov/.test(l))return{primary:'Očkováno',secondary:'Změnit termín',secondaryMode:'reschedule'};
    if(x.area==='Zahrada'&&/levand/.test(l))return{primary:'Hotovo letos',secondary:'Připomenout později',secondaryMode:'defer'};
    if(x.area==='Zahrada')return{primary:'Zkontrolováno',secondary:'Připomenout později',secondaryMode:'defer'};
    if(x.area==='Dům')return{primary:/kontrol/.test(l)?'Zkontrolováno':'Hotovo',secondary:'Připomenout později',secondaryMode:'defer'};

}
function followupProfile(x){
  const l=textOf(x);

  // Nejprve skutečný děj, až potom tematická kategorie: telefonát o smlouvě není prodloužení smlouvy.
  if(x.workflow==='appointment'&&x.appointmentStage==='scheduled')return{
    type:'appointment_next',title:'Domluvili jste další termín?',
    text:'Pokud ano, zadej ho rovnou. D zachová historii návštěvy i navazujících termínů.'};
  if(isAppointmentBooking(x))return{
    type:'appointment_book',title:'Na kdy jsi objednaný?',
    text:'Zadej skutečný termín návštěvy. Původní objednání zůstane v historii.'};
  if(x.kind==='waiting'){
    if(x.area==='Vozidla'&&(x.topic==='Servis'||/servis/.test(l)))return{
      type:'service',title:'Je domluvený termín servisu?',

    return{type:'generic_outcome',title:'Vzniklo z vyřešení něco dalšího?',

  }

    type:'call_outcome',title:'Co z hovoru vzniklo?',
    text:'Můžeš založit další telefonát, schůzku, čekání na odpověď či nový krok.'};
  // Administrativní činnost sama o sobě neznamená absolvovanou prohlídku, revizi ani obnovení smlouvy.
  if(x.kind==='todo'&&/^(?:zapsat|poznamenat|poslat|napsat|zaplatit|uhradit|vypovědět|připravit|vyřídit)(?=\s|$)/i.test(l))return{
    type:'generic_outcome',title:'Vzniklo z toho něco dalšího?',
    text:'Pokud ano, vytvoř další úkol, termín nebo čekání. Jinak věc uzavři.'};

    type:'vaccination_next',title:'Co dál s očkováním?',
    text:'Pokud už znáš termín dalšího očkování, zadej ho. Jinak si můžeš později připomenout objednání. D interval neodhaduje.'};
  if(x.kind==='watch'&&x.area==='Ben'&&/stříh/.test(l))return{
    type:'grooming',title:'Kdy připomenout objednání stříhání?',

    type:'dentist',title:'Kdy má být další kontrola?',
    text:'Po absolvování můžeš založit další zubní kontrolu.'};
  if(x.kind==='watch'&&x.area==='Vozidla'&&(x.topic==='STK'||/\bstk\b/.test(l)||/technick/.test(l)))return{
    type:'stk',title:'Pohlídat další STK?',
    text:'Vyber další termín vhodný pro konkrétní vozidlo.'};
  if(x.area==='Zahrada'&&(x.kind==='watch'||/^(?:ostříhat|zkontrolovat).*levandul/i.test(l)))return{
    type:'garden',title:'Připomenout to i další sezonu?',
    text:'U sezónních prací se může hodit připomenutí na příští rok.'};
  if(x.kind==='watch'&&x.area==='Dům'&&/topen|komín|kotel|reviz|vyčist/.test(l))return{
    type:'annual',title:'Pohlídat údržbu znovu?',
    text:'Pokud jde o pravidelnou údržbu, nastav připomenutí na další rok.'};
  if(x.kind==='watch'&&x.area==='Smlouvy')return{
    type:'contract',title:'Má smlouva nový konec?',
    text:'Pokud smlouva pokračuje, zadej nové datum platnosti.'};
  if(x.kind==='watch'&&/pojiště/.test(l))return{
    type:'annual',title:'Připomenout znovu za rok?',
    text:'Založ další termín pouze pokud je to správný interval.'};
  if(x.kind==='todo'||x.kind==='watch')return{
    type:'generic_outcome',title:'Vzniklo z toho něco dalšího?',
    text:'Navazuj dalším připomenutím, termínem, čekáním nebo úkolem. Jinak věc uzavři.'};

function removeItemsPermanently(ids){
  const removed=new Set(ids);
  if(!removed.size)return;
  state.items=state.items.filter(x=>!removed.has(x.id));
  const alive=new Map(state.items.map(x=>[x.id,x]));
  for(const x of state.items){
    if(x.followupId&&!alive.has(x.followupId))delete x.followupId;
    if(x.parentId&&!alive.has(x.parentId)){
      delete x.parentId;
      delete x.chainId;
      if(x.origin==='followup'){
        // Nezůstane zavádějící odkaz na záměrně smazanou původní věc.
        x.raw=displayTitle(x);
        delete x.origin;
      }
    }
  }
  function rootFor(x){
    const seen=new Set([x.id]);let current=x;
    while(current.parentId&&alive.has(current.parentId)&&!seen.has(current.parentId)){
      seen.add(current.parentId);current=alive.get(current.parentId);
    }
    return current.id;
  }
  for(const x of state.items){
    const root=rootFor(x);
    if(root===x.id)delete x.chainId;
    else x.chainId=root;
  }
  if(state.undo&&removed.has(state.undo.id)){state.undo=null;if(undoTimer)clearTimeout(undoTimer)}
  if(state.followup&&removed.has(state.followup.sourceId)){state.followup=null;state.followupMode=null;state.followupCustom=false}
  if(state.historyFor&&removed.has(state.historyFor))state.historyFor=null;
  save();
}

function chainFor(x){
  const rootId=x.chainId||x.id;
  return state.items
    .filter(i=>i.id===rootId||i.chainId===rootId)
    .sort((a,b)=>new Date(a.created||0)-new Date(b.created||0));
}
function historyEvent(i){
  const title=displayTitle(i);

  // DŮLEŽITÉ: naplánovaný termín má přednost před detekcí „objednat“ v původním raw textu.
  if(i.workflow==='appointment'&&i.appointmentStage==='scheduled'){
    const child=state.items.find(j=>j.parentId===i.id&&j.status==='active'&&j.due===i.due&&displayTitle(j)===title);
    if(i.status==='done'&&child)return {title:`✓ Termín domluven: ${title}`,meta:`${due?due+' · ':''}${i.completedAt?'domluveno '+fmt(i.completedAt):'domluveno'}`};
    return i.status==='done'
      ?{title:`✓ Návštěva: ${title}`,meta:`${due?due+' · ':''}${i.completedAt?'dokončeno '+fmt(i.completedAt):'dokončeno'}`}
      :{title:`→ Aktivní termín: ${title}`,meta:due||'Termín je aktivní'};
  }
  if(isAppointmentBooking(i)){
    return i.status==='done'
      ?{title:`✓ Upomínka k objednání: ${title}`,meta:i.completedAt?'vyřízeno '+fmt(i.completedAt):'vyřízeno'}
      :{title:`→ Upomínka k objednání: ${title}`,meta:'čeká na objednání'};
  }
  if(i.kind==='waiting'){
    return i.status==='done'
      ?{title:`✓ Čekání: ${title}`,meta:i.completedAt?'vyřešeno '+fmt(i.completedAt):'vyřešeno'}
      :{title:`→ Čekám: ${title}`,meta:`${i.since?'od '+fmt(i.since):'aktivní'}${i.attention?' · zkontrolovat '+fmt(i.attention):''}`};
  }
  return i.status==='done'
    ?{title:`✓ ${title}`,meta:`${due?due+' · ':''}${i.completedAt?'dokončeno '+fmt(i.completedAt):'dokončeno'}`}
    :{title:`→ ${title}`,meta:due||'aktivní'};
}
function historyDisplayChain(x){
  const chain=chainFor(x);
  // Legacy v0.4.16 could produce an already completed intermediary with the

// Kategorie: 450 ms podrzeni => presun v mrizce. Kratke klepnuti zustava otevreni.
let categoryDrag=null;
let categoryDragIgnoreClicksUntil=0;
let categoryAutoScrollFrame=0;
function initCategoryReordering(){
  function cleanup(){
    if(!categoryDrag)return;
    clearTimeout(categoryDrag.timer);
    categoryDrag.ghost?.remove();
    categoryDrag.tile?.classList.remove('categoryDragSource');
    document.body.classList.remove('categoryDragActive');
    categoryDrag=null;
    if(categoryAutoScrollFrame)cancelAnimationFrame(categoryAutoScrollFrame);
    categoryAutoScrollFrame=0;
  }
  function placeAt(clientX,clientY){
    if(!categoryDrag?.active)return;
    const d=categoryDrag;
    d.ghost.style.left=(clientX-d.offsetX)+'px';
    d.ghost.style.top=(clientY-d.offsetY)+'px';
    // Vybirame slot mrizky podle prstu, ne podle titulku pod nim.
    // To zabranuje preskakovani mezi pozicemi, kdyz se po presunu zmeni cilovy prvek.
    const els=[...d.grid.querySelectorAll('.tile[data-area]')];
    let nearest=-1,best=Infinity;
    els.forEach((el,i)=>{
      const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
      const dist=(cx-clientX)**2+(cy-clientY)**2;
      if(dist<best){best=dist;nearest=i}
    });
    const from=els.indexOf(d.tile);
    if(from<0||nearest<0||nearest===from)return;
    const target=els[nearest];
    if(from<nearest)d.grid.insertBefore(d.tile,target.nextSibling);
    else d.grid.insertBefore(d.tile,target);
  }
  function autoScroll(){
    categoryAutoScrollFrame=0;
    if(!categoryDrag?.active)return;
    const d=categoryDrag;
    const edge=95, bottom=window.innerHeight-95;
    let speed=0;
    if(d.y<edge)speed=-Math.min(15,(edge-d.y)*.19);
    else if(d.y>bottom)speed=Math.min(15,(d.y-bottom)*.19);
    if(speed){
      const before=window.scrollY;
      window.scrollBy(0,speed);
      if(window.scrollY!==before)placeAt(d.x,d.y);
    }
    categoryAutoScrollFrame=requestAnimationFrame(autoScroll);
  }
  document.addEventListener('pointerdown',e=>{
    if(state.tab!=='things'||state.manageMode||state.categorySelectMode||e.button!==0||categoryDrag)return;
    if(e.target.closest('button,a,input,select,textarea,[data-category-menu]'))return;
    const tile=e.target.closest('.grid .tile[data-area]');
    if(!tile)return;
    const rect=tile.getBoundingClientRect();
    categoryDrag={tile,grid:tile.parentElement,id:e.pointerId,x:e.clientX,y:e.clientY,
      offsetX:e.clientX-rect.left,offsetY:e.clientY-rect.top,active:false,moved:false,ghost:null,timer:null};
    categoryDrag.timer=setTimeout(()=>{
      const d=categoryDrag;
      if(!d||d.id!==e.pointerId||d.active||!d.tile.isConnected)return;
      d.active=true;
      categoryDragIgnoreClicksUntil=Date.now()+700;
      d.ghost=d.tile.cloneNode(true);
      d.ghost.classList.add('categoryDragGhost');
      d.ghost.removeAttribute('data-area');
      d.ghost.setAttribute('aria-hidden','true');
      d.ghost.style.width=rect.width+'px';
      d.ghost.style.height=rect.height+'px';
      d.ghost.style.left=rect.left+'px';
      d.ghost.style.top=rect.top+'px';
      d.ghost.querySelectorAll('button').forEach(x=>x.disabled=true);
      document.body.append(d.ghost);
      d.tile.classList.add('categoryDragSource');
      document.body.classList.add('categoryDragActive');
      if(navigator.vibrate)try{navigator.vibrate(16)}catch{}
      categoryAutoScrollFrame=requestAnimationFrame(autoScroll);
    },450);
  });
  document.addEventListener('pointermove',e=>{
    const d=categoryDrag;
    if(!d||e.pointerId!==d.id)return;
    if(!d.active){if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>9)cleanup();return}
    d.x=e.clientX;d.y=e.clientY;d.moved=true;
    if(e.cancelable)e.preventDefault();
    placeAt(d.x,d.y);
  },{passive:false});
  // iOS Safari: po aktivaci zabrani prirozenemu scrollu, pred aktivaci scroll funguje.
  document.addEventListener('touchmove',e=>{
    if(categoryDrag?.active&&e.cancelable)e.preventDefault();
  },{passive:false});
  function finish(e,cancelled=false){
    const d=categoryDrag;
    if(!d||e.pointerId!==d.id)return;
    if(d.active){
      categoryDragIgnoreClicksUntil=Date.now()+700;
      if(!cancelled&&d.moved){
        const order=[...d.grid.querySelectorAll('.tile[data-area]')].map(el=>el.dataset.area);
        updateCategoryOrder(order);
      }
    }
    const shouldRefresh=!!d.needsRefresh;
    cleanup();
    if(shouldRefresh)render();
  }
  document.addEventListener('pointerup',e=>finish(e));
  document.addEventListener('pointercancel',e=>finish(e,true));
  document.addEventListener('contextmenu',e=>{
    if(e.target.closest('.grid .tile[data-area]'))e.preventDefault();
  });
  window.addEventListener('blur',cleanup);
  window.addEventListener('pagehide',cleanup);
}

function render(){if(categoryDrag?.active){categoryDrag.needsRefresh=true;return}let content='';if(state.tab==='today')content=today();if(state.tab==='add')content=add();if(state.tab==='watch')content=listTab('watch','Hlídám','Dlouhodobé věci přehledně na jednom místě.');if(state.tab==='waiting')content=listTab('waiting','Čekám na','Otevřené věci, které nemusíš držet v hlavě.');if(state.tab==='things')content=state.openArea&&!state.manageMode?categoryView(state.openArea):things();$('#app').innerHTML=`<main class="shell ${state.manageMode?'shellManage':''}">${content}</main>${nav()}${state.manageMode?`<div class="manageBar"><button class="secondary" id="cancelManage">Zrušit</button><button class="deleteSelected" id="deleteSelected" ${state.selectedIds.length?'':'disabled'}>Smazat vybrané (${state.selectedIds.length})</button></div>`:''}${state.categorySelectMode?`<div class="manageBar"><button class="secondary" id="cancelCategorySelect">Zrušit</button><button class="deleteSelected" id="deleteSelectedCategories" ${state.selectedCategories.length?'':'disabled'}>Smazat kategorie (${state.selectedCategories.length})</button></div>`:''}${state.toast?`<div class="toast">${esc(state.toast)}</div>`:''}${state.undo?`<div class="undoToast"><span>${esc(state.undo.title)} · ${esc(state.undo.label||'Hotovo')}</span><button id="undoAction">Vrátit</button></div>`:''}${modal()}`;bind()}

const fuCustom=$('[data-fu-custom]');if(fuCustom)fuCustom.onclick=()=>{state.followupCustom=true;state.followupMode=null;render()};
const fuRestore=$('[data-fu-restore]');if(fuRestore)fuRestore.onclick=()=>{if(!followSource)return;followSource.status='active';followSource.completedAt=null;followSource.followupId=null;save();state.followup=null;state.followupCustom=false;state.followupMode=null;toast('Vráceno k objednání.');};
const fuNone=$('[data-fu-none]');if(fuNone)fuNone.onclick=()=>{state.followup=null;state.followupCustom=false;state.followupMode=null;toast('Hotovo bez další návaznosti.');};
const cancelFollowupDate=$('#cancelFollowupDate');if(cancelFollowupDate)cancelFollowupDate.onclick=()=>{state.followupCustom=false;render()};
const saveFollowupDate=$('#saveFollowupDate');if(saveFollowupDate)saveFollowupDate.onclick=()=>{
  if(!followSource)return;
  const v=$('#followupDate').value;if(!v)return toast('Vyber datum.');
  const date=dateFromInput(v);let opts={};
  if(state.followupMode==='booking_reminder_custom'){
    createBookingReminder(followSource,date);
    state.followup=null;state.followupCustom=false;state.followupMode=null;
    return toast('Připomenutí objednání je uložené.');
  }
  if(state.followup.type==='appointment_book'){
    const topic=appointmentTopicFromItem(followSource);
    opts={
      title:appointmentTitleFromItem(followSource),kind:'watch',area:followSource.area,
      entity:followSource.entity||null,topic:followSource.topic||topic,
      workflow:'appointment',appointmentStage:'scheduled',attention:new Date(date).toISOString()
    };
  }else if(state.followup.type==='vaccination_next'){
    opts={title:displayTitle(followSource),kind:'watch',area:followSource.area,
      entity:followSource.entity||null,topic:'Očkování',workflow:null,
      attention:new Date(date).toISOString()};
  }else if(state.followup.type==='appointment_next'){
    opts={
      title:displayTitle(followSource),kind:'watch',area:followSource.area,
      entity:followSource.entity||null,topic:followSource.topic||appointmentTopicFromItem(followSource),
      workflow:'appointment',appointmentStage:'scheduled',attention:new Date(date).toISOString()
    };
  }else if(state.followup.type==='service'){
    opts={title:displayTitle(followSource),kind:'watch',area:'Vozidla',entity:followSource.entity||'Vozidlo',topic:'Servis',mode:'service'};
  }else if(state.followup.type==='contract'){
    opts={title:displayTitle(followSource),kind:'watch',area:'Smlouvy'};
  }
  const fuType=state.followup.type;
  createFollowup(followSource,date,opts);
  state.followup=null;state.followupCustom=false;state.followupMode=null;
  toast(fuType==='appointment_book'?'Termín je uložený.':fuType==='appointment_next'?'Další termín je uložený.':'Návaznost je uložená.');
};
$$('[data-defer-days]').forEach(b=>b.onclick=()=>{const x=state.items.find(i=>i.id===state.deferFor);if(x)postponeItem(x,+b.dataset.deferDays)});
const deferCustom=$('[data-defer-custom]');if(deferCustom)deferCustom.onclick=()=>{state.deferCustom=true;render()};
const deferCancel=$('[data-defer-cancel]');if(deferCancel)deferCancel.onclick=()=>{state.deferFor=null;state.deferCustom=false;render()};
const cancelDeferDate=$('#cancelDeferDate');if(cancelDeferDate)cancelDeferDate.onclick=()=>{state.deferCustom=false;render()};
const saveDeferDate=$('#saveDeferDate');if(saveDeferDate)saveDeferDate.onclick=()=>{const x=state.items.find(i=>i.id===state.deferFor);const v=$('#deferDate').value;if(!x||!v)return toast('Vyber datum.');postponeToDate(x,dateFromInput(v));};
const cancelRescheduleDate=$('#cancelRescheduleDate');if(cancelRescheduleDate)cancelRescheduleDate.onclick=()=>{state.rescheduleFor=null;render()};
const saveRescheduleDate=$('#saveRescheduleDate');if(saveRescheduleDate)saveRescheduleDate.onclick=()=>{const x=state.items.find(i=>i.id===state.rescheduleFor);const v=$('#rescheduleDate').value;if(!x||!v)return toast('Vyber datum.');rescheduleItem(x,dateFromInput(v));};
const cancelDeleteOne=$('#cancelDeleteOne');if(cancelDeleteOne)cancelDeleteOne.onclick=()=>{state.deleteOneFor=null;render()};
const confirmDeleteOne=$('#confirmDeleteOne');if(confirmDeleteOne)confirmDeleteOne.onclick=()=>{const id=state.deleteOneFor;state.deleteOneFor=null;if(id)removeItemsPermanently([id]);state.detail=null;state.editing=null;toast('Věc byla smazaná.')};
const x=state.items.find(i=>i.id===state.detail);if(x){
  const complete=$('#completeAction');if(complete)complete.onclick=()=>completeItem(x);
  const secondary=$('#secondaryAction');if(secondary)secondary.onclick=()=>{const ap=actionProfile(x);if(ap.secondaryMode==='reschedule'){state.rescheduleFor=x.id;state.detail=null;render()}else{state.deferFor=x.id;state.deferCustom=false;state.detail=null;render()}};
  const del=$('#delete');if(del)del.onclick=()=>{state.detail=null;state.deleteOneFor=x.id;render()};
}}
function previewAreaOptions(x){const areas=allAreas();if(x.area&&!areas.includes(x.area))areas.push(x.area);return areas.map(a=>`<option value="${esc(a)}" ${x.area===a?'selected':''}>${esc(areaLabel(a))}${areaHidden(a)?' (skrytá)':''}</option>`).join('')+`<option value="__new_category__">＋ Vytvořit novou kategorii…</option>`}
function previewDateValue(x){return dateInputValue(x.kind==='voucher'?x.expires:(x.due||null))}
function previewItemEditor(x,i){
  const dateLabel=x.kind==='voucher'?'Platnost':'Datum / termín';
  const extraDate=x.periodLabel&&!x.due?`<div class="smallLabel">Období: ${esc(x.periodLabel)}</div>`:'';
  return `<div class="previewItem">
    <div class="value">${x.icon} ${esc(x.title)}</div>
    <div class="previewQuickRow"><span>${esc(labelKind(x.kind))}</span><select class="previewArea" data-preview-area="${i}" aria-label="Oblast">${previewAreaOptions(x)}</select></div>
    ${x.due?`<div class="smallLabel">Termín: ${fmt(x.due)}${x.daypart?' · '+esc(x.daypart):''}</div>`:''}${x.expires?`<div class="smallLabel">Platnost: ${fmt(x.expires)}</div>`:''}${x.value?`<div class="smallLabel">Hodnota: ${x.value.toLocaleString('cs-CZ')} Kč</div>`:''}${extraDate}
    <details class="previewDetails"><summary>Upravit podrobnosti ›</summary><div class="previewEditGrid">
      <label>Název<input data-preview-title="${i}" value="${esc(x.title)}"></label>
      <label>Konkrétně / osoba / objekt<input data-preview-entity="${i}" value="${esc(x.entity||'')}" placeholder="např. Audi Q8, Táta, Novák"></label>
      <label>Co hlídám / typ věci<input data-preview-topic="${i}" value="${esc(x.topic||'')}" placeholder="např. STK, Servis, Schůzka"></label>
      <label>${dateLabel}<input data-preview-date="${i}" type="date" value="${previewDateValue(x)}"></label><label>Část dne<select data-preview-daypart="${i}"><option value="" ${!x.daypart?'selected':''}>Bez určení</option>${['ráno','dopoledne','odpoledne','večer','v noci'].map(d=>`<option value="${d}" ${x.daypart===d?'selected':''}>${d}</option>`).join('')}</select></label>
    </div></details>
  </div>`
}
function previewMany(xs){if(!xs.length)return'';return `<div class="parse"><h3>✦ ${xs.length===1?'Rozumím tomu takto':'Našel jsem '+xs.length+' věcí'}</h3>${xs.map((x,i)=>previewItemEditor(x,i)).join('')}</div>`}
function preview(x){return previewMany([x])}
function applyPreviewArea(x,area){
  if(!x._originalArea)x._originalArea=x.area;
  x.area=area;
  x.entity=detectEntity(x.raw||x.title,area);
  x.topic=detectTopic(x.raw||x.title,area);
  x.icon=iconFor(x.kind,area);
  if(x.kind==='shopping'&&area==='Poukazy')x.kind='voucher';
  return x;
}
function applyPreviewDate(x,value){
  const iso=dateFromInput(value);x.periodLabel=null;x.snoozedUntil=null;
  if(x.kind==='voucher'){
    x.expires=iso;x.due=null;x.attention=iso?new Date(new Date(iso).getTime()-30*dayMs).toISOString():null;
  }else if(x.kind==='waiting'){
    x.due=iso;x.attention=iso||x.attention;
  }else{
    x.due=iso;
    if(!iso)x.attention=x.kind==='todo'?new Date().toISOString():null;
    else if(x.kind==='todo')x.attention=iso;
    else if(x.area==='Ben')x.attention=new Date(new Date(iso).getTime()-14*dayMs).toISOString();
    else if(['Vozidla','Zdraví','Smlouvy'].includes(x.area))x.attention=new Date(new Date(iso).getTime()-30*dayMs).toISOString();
    else x.attention=iso;
  }
}
function bindPreviewDraft(){
  $$('[data-preview-area]').forEach(el=>el.onchange=()=>{const i=+el.dataset.previewArea,x=state.addDraft[i];if(!x)return;if(el.value==='__new_category__'){state.categoryEditor={mode:'custom',name:'',emoji:'',keywords:[],color:CATEGORY_COLORS[0],originalName:null,assignToDraftIndex:i};state.categoryColor=CATEGORY_COLORS[0];render();return}applyPreviewArea(x,el.value);const p=$('#preview');if(p){p.innerHTML=previewMany(state.addDraft);bindPreviewDraft()}});
  $$('[data-preview-title]').forEach(el=>el.oninput=()=>{const x=state.addDraft[+el.dataset.previewTitle];if(x){x.title=el.value;x.manualTitle=el.value}});
  $$('[data-preview-entity]').forEach(el=>el.oninput=()=>{const x=state.addDraft[+el.dataset.previewEntity];if(x)x.entity=el.value.trim()||null});
  $$('[data-preview-topic]').forEach(el=>el.oninput=()=>{const x=state.addDraft[+el.dataset.previewTopic];if(x)x.topic=el.value.trim()||null});
  $$('[data-preview-date]').forEach(el=>el.onchange=()=>{const x=state.addDraft[+el.dataset.previewDate];if(!x)return;applyPreviewDate(x,el.value)});
  $$('[data-preview-daypart]').forEach(el=>el.onchange=()=>{const x=state.addDraft[+el.dataset.previewDaypart];if(x)x.daypart=el.value||null});
}
function labelKind(k){return({todo:'Udělám',watch:'Hlídám',waiting:'Čekám na',shopping:'Nákup',voucher:'Poukaz'})[k]||k}
const APP_VERSION='0.4.18';
let updateChecking=false;
async function checkForUpdate(){
  if(updateChecking)return;
  updateChecking=true;
  try{
    const u=new URL('index.html',location.href);
    u.searchParams.set('__pd_check',Date.now().toString());
    const r=await fetch(u.toString(),{cache:'no-store'});
    if(!r.ok)return;
    const html=await r.text();
    // Číslo verze čteme z jednoznačné konstanty, nikoli z nápisů na obrazovce.
    const m=html.match(/\bconst\s+APP_VERSION\s*=\s*['"](\d+\.\d+\.\d+)['"]/);
    const remote=m&&m[1];
    // Nikdy nepřesměrovávat na starší verzi ani do smyčky při chybně cachované stránce.
    const rv=(remote||'').split('.').map(Number),lv=APP_VERSION.split('.').map(Number);
    const newer=rv.length===3&&rv.every(Number.isFinite)&&(
      rv[0]>lv[0]||(rv[0]===lv[0]&&(rv[1]>lv[1]||(rv[1]===lv[1]&&rv[2]>lv[2])))
    );
    if(remote&&newer){
      const next=new URL('index.html',location.href);
      next.searchParams.set('v',remote);
      next.searchParams.set('__pd_load',Date.now().toString());
      location.replace(next.toString());
    }
  }catch(e){}finally{updateChecking=false}
}
window.addEventListener('pagehide',()=>save());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();else checkForUpdate()});
window.addEventListener('pageshow',()=>checkForUpdate());
if(navigator.storage?.persist){navigator.storage.persist().catch(()=>{})}
initCategoryReordering();render();hydrateStorage();checkForUpdate();</script>
