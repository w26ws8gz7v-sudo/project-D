540px,calc(100% - 20px));background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:10px;z-index:19;box-shadow:0 16px 34px rgba(15,23,42,.18);display:grid;grid-template-columns:1fr 1.5fr;gap:8px}.manageBar button{border-radius:14px;padding:12px 10px;font-weight:800}.manageBar .deleteSelected{background:#be123c;color:#fff;border:0}.manageBar .deleteSelected:disabled{opacity:.38}.confirmBox{background:#fff1f2;border:1px solid #fecdd3;border-radius:16px;padding:14px;color:#881337;margin-top:12px}.hidden{display:none!important}

<body>

  <script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=d=>new Intl.DateTimeFormat('cs-CZ').format(new Date(d));
const dayMs=86400000;
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const state={tab:'today',items:loadLocal(),detail:null,toast:null,undo:null,editing:null,manageMode:false,selectedIds:[],confirmDelete:null};
let undoTimer=null;
const DB_NAME='projectD-db-v1', DB_STORE='kv', DB_KEY='items';
function openDB(){return new Promise((resolve,reject)=>{try{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
async function idbGet(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly');const req=tx.objectStore(DB_STORE).get(DB_KEY);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close()})}
async function idbSet(value){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(value,DB_KEY);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function hydrateStorage(){try{const stored=await idbGet();if(Array.isArray(stored)){state.items=stored;try{localStorage.setItem('projectD-items',JSON.stringify(stored))}catch{};render()}else{await idbSet(state.items)}}catch(e){/* fallback to localStorage */}}
function demo(){const now=today0();const add=n=>new Date(now.getTime()+n*dayMs).toISOString();return[
{id:uid(),title:'Zaplatit pojištění auta',kind:'todo',area:'Auto',status:'active',due:add(1),attention:add(0),icon:'🚗',priority:'urgent',created:new Date().toISOString()},
{id:uid(),title:'Zavolat zákazníkovi',kind:'todo',area:'Práce',status:'active',due:add(0),attention:add(0),icon:'📞',priority:'soon',created:new Date().toISOString()},
{id:uid(),title:'Objednat Bena na stříhání',kind:'watch',area:'Ben',status:'active',due:add(9),attention:add(9),icon:'✂️',created:new Date().toISOString()},
{id:uid(),title:'Zubař',kind:'watch',area:'Zdraví',status:'active',due:add(28),attention:add(28),icon:'🦷',created:new Date().toISOString()},
{id:uid(),title:'Servis auta',kind:'waiting',area:'Auto',status:'active',since:add(-4),attention:add(1),icon:'🔧',created:new Date().toISOString()},
{id:uid(),title:'Reklamace sluchátek',kind:'waiting',area:'Osobní',status:'active',since:add(-12),attention:add(2),icon:'🎧',created:new Date().toISOString()},
{id:uid(),title:'Poukaz na masáž',kind:'voucher',area:'Poukazy',status:'active',value:2000,expires:add(25),attention:add(0),icon:'🎁',created:new Date().toISOString()},
]}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem('projectD-items')||'null');return Array.isArray(x)?x:demo()}catch{return demo()}}
function save(){try{localStorage.setItem('projectD-items',JSON.stringify(state.items))}catch{};idbSet(state.items).catch(()=>{})}
function daysBetween(a,b){return Math.ceil((new Date(a)-new Date(b))/dayMs)}
function nextWeekday(text){const now=today0();const days={"pondělí":1,"pondeli":1,"úterý":2,"utery":2,"středu":3,"stredu":3,"středa":3,"čtvrtek":4,"ctvrtek":4,"pátek":5,"patek":5,"pátku":5,"patku":5,"sobotu":6,"sobota":6,"neděli":0,"nedeli":0,"neděle":0};const l=text.toLowerCase();for(const [name,target] of Object.entries(days)){if(new RegExp(`\\b(?:do|v|ve)\\s+${name}\\b`,'i').test(l)){const d=new Date(now);let add=(target-d.getDay()+7)%7;d.setDate(d.getDate()+add);return d}}return null}
function parseDate(text){const now=today0();let d=null;let m=text.match(/za\s+(\d+)\s*(den|dny|dnů|tyden|týden|týdny|týdnů|mesic|měsíc|měsíce|měsíců)/i);if(m){const n=+m[1],u=m[2].toLowerCase();d=new Date(now);if(u.startsWith('den')||u.startsWith('dn'))d.setDate(d.getDate()+n);else if(u.includes('tý')||u.includes('ty'))d.setDate(d.getDate()+7*n);else d.setMonth(d.getMonth()+n);return d}
if(/za\s+p[uů]l\s+roku/i.test(text)){d=new Date(now);d.setMonth(d.getMonth()+6);return d}
m=text.match(/(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);if(m){d=new Date(+m[3],+m[2]-1,+m[1]);return d}
if(/pozítří/i.test(text)){d=new Date(now);d.setDate(d.getDate()+2);return d}
if(/zítra/i.test(text)){d=new Date(now);d.setDate(d.getDate()+1);return d}
if(/\bdnes\b/i.test(text))return new Date(now);
return nextWeekday(text)}
function monthPeriod(text){const forms=[
{m:0,label:'leden',re:/(?:leden|lednu|ledna)/i},{m:1,label:'únor',re:/(?:únor|únoru)/i},{m:2,label:'březen',re:/(?:březen|březnu)/i},{m:3,label:'duben',re:/(?:duben|dubnu)/i},{m:4,label:'květen',re:/(?:květen|květnu)/i},{m:5,label:'červen',re:/(?:červen|červnu)/i},{m:6,label:'červenec',re:/(?:červenec|červenci)/i},{m:7,label:'srpen',re:/(?:srpen|srpnu)/i},{m:8,label:'září',re:/září/i},{m:9,label:'říjen',re:/(?:říjen|říjnu)/i},{m:10,label:'listopad',re:/(?:listopad|listopadu)/i},{m:11,label:'prosinec',re:/(?:prosinec|prosinci)/i}];
const now=today0();for(const x of forms){if(x.re.test(text)){const ym=text.match(/\b(20\d{2})\b/);let y=ym?+ym[1]:now.getFullYear();let d=new Date(y,x.m,1);if(!ym&&d<now)d=new Date(y+1,x.m,1);return{date:d,label:`${x.label} ${d.getFullYear()}`}}}return null}
function seasonPeriod(text){const l=text.toLowerCase();const now=today0();let m=null,label='';if(/na\s+jaře|\bjaro\b/.test(l)){m=2;label='jaro'}else if(/v\s+létě|\bléto\b/.test(l)){m=5;label='léto'}else if(/na\s+podzim|\bpodzim\b/.test(l)){m=8;label='podzim'}else if(/v\s+zimě|\bzima\b/.test(l)){m=11;label='zima'}if(m===null)return null;let y=now.getFullYear();let d=new Date(y,m,1);if(d<now)d=new Date(y+1,m,1);return{date:d,label:`${label} ${d.getFullYear()}`}}
function temporalInfo(text){const exact=parseDate(text);if(exact)return{date:exact,periodLabel:null,exact:true};const mp=monthPeriod(text);if(mp)return{date:mp.date,periodLabel:mp.label,exact:false};const sp=seasonPeriod(text);if(sp)return{date:sp.date,periodLabel:sp.label,exact:false};return{date:null,periodLabel:null,exact:false}}
function minusMonth(date){const d=new Date(date);const original=d.getDate();d.setMonth(d.getMonth()-1);if(d.getDate()!==original)d.setDate(0);return d}
function money(text){const m=text.match(/(?:za|v hodnotě|hodnota)?\s*(\d[\d\s.]*)\s*(?:kč|korun)/i);return m?parseInt(m[1].replace(/[\s.]/g,''),10):null}
function detectArea(text){const l=text.toLowerCase();if(/smlouv|výpověd|internet|tarif|energie|dodavatel/.test(l))return'Smlouvy';if(/zahrad|levand|okrasn|trávník|trávy|strom|hnojiv|keř|záhon/.test(l))return'Zahrada';if(/ben(?:a|ovi|em)?|pro\s+bena|pes|veterin|granul/.test(l))return'Ben';if(/auto|stk|technick|servis\s+auta|pojištěn[ií]\s+auta/.test(l))return'Auto';if(/zubař|doktor|lékař|preventiv|ordinac|očkován/.test(l))return'Zdraví';if(/nabídk|zákazník|firma|práce|kolega|novák/.test(l))return'Práce';return'Osobní'}
function stripTiming(t){return t
.replace(/^na\s+jaře\s+/i,'').replace(/^v\s+létě\s+/i,'').replace(/^na\s+podzim\s+/i,'').replace(/^v\s+zimě\s+/i,'')
.replace(/\s+(?:dnes|zítra|pozítří)(?:\s+(?:ráno|dopoledne|odpoledne|večer))?$/i,'')
.replace(/\s+(?:je\s+)?(?:v|ve)\s+(?:lednu|únoru|březnu|dubnu|květnu|červnu|červenci|srpnu|září|říjnu|listopadu|prosinci)(?:\s+20\d{2})?$/i,'')
.trim()}
function cleanTitle(text,kind,area){let t=text.trim().replace(/^[-–—\s]+/,'');
if(kind==='waiting')t=t.replace(/^čekám(?:\s+na)?\s*/i,'').replace(/^až\s*/i,'').replace(/,\s*(?:říkali|řekli|slíbili|mají|měli).*$/i,'');
if(kind==='shopping'){
  t=t.replace(/^(?:musím|potřebuji|chci)\s+(?:koupit|dokoupit)\s+/i,'')
     .replace(/^(?:koupit|dokoupit)\s+/i,'')
     .replace(/^vzal jsem(?:\s+si)?(?:\s+z\s+[^,.]+)?\s+poslední\s+/i,'')
     .replace(/^vzal jsem\s+poslední\s+/i,'')
     .replace(/^(?:došel mi|došla mi|došlo mi|dochází mi|došla|došlo|dochází)\s+/i,'');
}
if(kind==='voucher'){t=t.replace(/^(mám|dostal jsem|dostala jsem)\s*/i,'').replace(/\s+za\s+\d[\d\s.]*\s*(?:kč|korun).*$/i,'').replace(/,?\s*platí\s+do\s+.*$/i,'')}
if(area==='Smlouvy')t=t.replace(/\s+končí\s+.*$/i,'');
if(/\bstk\b/i.test(t))t=t.replace(/\s+(?:je\s+)?(?:v|ve)\s+.*$/i,'');
t=stripTiming(t).replace(/[.!?]+$/,'').trim();
return t.charAt(0).toUpperCase()+t.slice(1)}
function parse(text){const l=text.toLowerCase();let kind='todo',area=detectArea(text),icon='📝',attention=null,due=null,since=null,value=null,expires=null,periodLabel=null;const ti=temporalInfo(text);
if(/čekám|až mi|až se ozve|odpověď|ozvou\s+se/.test(l)){kind='waiting';since=new Date().toISOString();due=ti.exact&&ti.date?ti.date.toISOString():null;attention=ti.date?ti.date.toISOString():new Date(Date.now()+5*dayMs).toISOString();icon='⏳'}
else if(/poukaz|voucher|dárkov(á|y) karta|kredit/.test(l)){kind='voucher';area='Poukazy';icon='🎁';value=money(text);expires=ti.date?ti.date.toISOString():null;periodLabel=ti.periodLabel;if(expires){attention=new Date(new Date(expires).getTime()-30*dayMs).toISOString()}}
else if(/mouka|mléko|granul|tablety do myčky|toalet|\bkoupit\b|\bdokoupit\b|došla|dochází|poslední|\bjar\b|rohlík|banán/.test(l)){kind='shopping';if(area==='Osobní')area='Domácnost';icon='🛒';attention=null;due=ti.exact&&ti.date?ti.date.toISOString():null;periodLabel=ti.periodLabel}
else if(['Ben','Auto','Smlouvy','Zahrada','Zdraví'].includes(area)){kind='watch';icon=area==='Ben'?'🐾':area==='Auto'?'🚗':area==='Smlouvy'?'📄':area==='Zahrada'?'🌿':'🦷';periodLabel=ti.periodLabel;if(ti.exact&&ti.date)due=ti.date.toISOString();if(ti.date){if(area==='Ben')attention=ti.exact?new Date(ti.date.getTime()-14*dayMs).toISOString():ti.date.toISOString();else if(area==='Zahrada')attention=ti.date.toISOString();else if(area==='Smlouvy'&&/měsíc\s+předem/i.test(l))attention=minusMonth(ti.date).toISOString();else attention=new Date(ti.date.getTime()-30*dayMs).toISOString()}}
else {if(ti.exact&&ti.date)due=ti.date.toISOString();periodLabel=ti.periodLabel;attention=ti.date?ti.date.toISOString():new Date().toISOString();if(area==='Práce')icon='💼'}
return{id:uid(),title:cleanTitle(text,kind,area),raw:text,kind,area,icon,status:'active',created:new Date().toISOString(),attention,due,since,value,expires,periodLabel}}
function splitInput(text){
  let source=String(text||'').replace(/\r/g,'\n').trim();
  if(!source)return[];
  source=source.replace(/(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/g,(_,d,m,y)=>`${d}§${m}§${y}`);
  const parts=source.split(/(?:[!?;]+|\.(?=\s|$)|\n+)/).map(s=>s.replace(/§/g,'.').trim()).filter(Boolean);
  const out=[];
  const taskVerbs='zavolat|zařídit|objednat|vyzvednout|poslat|napsat|zaplatit|ověřit|zkontrolovat|ostříhat|rezervovat|přihlásit|odvézt|přivézt|koupit|dokoupit';
  parts.forEach(part=>{
    let p=part.replace(/^a\s+ještě\s+/i,'').replace(/^a\s+/i,'').trim();
    const shop=p.match(/^(?:(?:musím|potřebuji|chci)\s+)?(?:koupit|dokoupit)\s+(.+)$/i);
    if(shop){
      let payload=shop[1].trim();
      let tail='';
      const tm=payload.match(/\s+((?:zítra|dnes|pozítří)(?:\s+(?:ráno|dopoledne|odpoledne|večer))?)$/i);
      if(tm){tail=' '+tm[1];payload=payload.slice(0,tm.index).trim()}
      const items=payload.split(/\s*,\s*|\s+a\s+/i).map(x=>x.trim()).filter(Boolean);
      if(items.length>1){items.forEach(x=>out.push('Koupit '+x+tail));return}
    }
    const re=new RegExp('\\s+a\\s+(?=(?:'+taskVerbs+')\\b)','i');
    const tasks=p.split(re).map(x=>x.trim()).filter(Boolean);
    if(tasks.length>1){const pm=p.match(/^(na\s+jaře|v\s+létě|na\s+podzim|v\s+zimě|(?:v|ve)\s+(?:lednu|únoru|březnu|dubnu|květnu|červnu|červenci|srpnu|září|říjnu|listopadu|prosinci)(?:\s+20\d{2})?)\s+/i);const prefix=pm?pm[1]+' ':'';tasks.forEach((x,i)=>out.push(!i||!prefix?x:prefix+x));return}
    out.push(p);
  });
  return out;
}

const cancelEdit=$('#cancelEdit');if(cancelEdit)cancelEdit.onclick=()=>{state.editing=null;render()};
const saveEdit=$('#saveEdit');if(saveEdit)saveEdit.onclick=()=>{const x=state.items.find(i=>i.id===state.detail);if(!x)return;const title=$('#editTitle').value.trim();if(!title)return toast('Název nemůže být prázdný.');const kind=$('#editKind').value,area=$('#editArea').value,date=dateFromInput($('#editDate').value),val=parseInt($('#editValue').value||'0',10)||null;x.manualTitle=title;x.title=title;x.kind=kind;x.area=area;x.icon=iconFor(kind,area);x.due=null;x.since=null;x.expires=null;x.periodLabel=null;x.value=kind==='voucher'?val:null;if(kind==='shopping'){x.attention=null}else if(kind==='waiting'){x.since=date||new Date().toISOString();x.attention=new Date(new Date(x.since).getTime()+5*dayMs).toISOString()}else if(kind==='voucher'){x.expires=date;x.attention=date?new Date(new Date(date).getTime()-30*dayMs).toISOString():null}else{x.due=date;x.attention=date||(kind==='todo'?new Date().toISOString():null)}save();state.editing=null;toast('Uloženo.');};
const editItem=$('#editItem');if(editItem)editItem.onclick=()=>{state.editing=state.detail;render()};
const finishShopping=id=>{const item=state.items.find(i=>i.id===id);if(!item)return;item.status='done';save();state.undo={id:item.id,title:displayTitle(item)};if(undoTimer)clearTimeout(undoTimer);const remaining=state.items.some(i=>i.status==='active'&&i.kind==='shopping');if(state.detail==='__shopping__'&&!remaining)state.detail=null;render();undoTimer=setTimeout(()=>{if(state.undo&&state.undo.id===id){state.undo=null;render()}},4500)};
$$('[data-shop-done]').forEach(b=>b.onclick=e=>{e.stopPropagation();finishShopping(b.dataset.shopDone)});
$$('[data-shop-open]').forEach(e=>e.onclick=()=>{state.detail=e.dataset.shopOpen;render()});
const undoShopping=$('#undoShopping');if(undoShopping)undoShopping.onclick=()=>{const u=state.undo;if(!u)return;const item=state.items.find(i=>i.id===u.id);if(item){item.status='active';save()}state.undo=null;if(undoTimer)clearTimeout(undoTimer);render()};
if(state.detail==='__shopping__')return;
const x=state.items.find(i=>i.id===state.detail);if(x){const done=$('#done');if(done)done.onclick=()=>{x.status=x.status==='active'?'done':'active';save();state.detail=null;toast(x.kind==='shopping'?'Koupeno.':x.kind==='voucher'?'Označeno jako použité.':'Hotovo.');};const tomorrow=$('#tomorrow');if(tomorrow)tomorrow.onclick=()=>{x.attention=new Date(today0().getTime()+dayMs).toISOString();save();state.detail=null;toast('Vrátím ti to zítra.');};const later=$('#later');if(later)later.onclick=()=>{const days=x.kind==='waiting'?5:7;x.attention=new Date(today0().getTime()+days*dayMs).toISOString();save();state.detail=null;toast(x.kind==='waiting'?'Dobře, ještě čekáme.':'Připomenu později.');};const del=$('#delete');if(del)del.onclick=()=>{state.items=state.items.filter(i=>i.id!==x.id);save();state.detail=null;state.editing=null;toast('Smazáno.');}}}
function previewMany(xs){if(xs.length===1)return preview(xs[0]);return `<div class="parse"><h3>✦ Našel jsem ${xs.length} věcí</h3>${xs.map((x,i)=>`<div style="padding:${i?'10px 0':'4px 0 10px'};${i?'border-top:1px solid #edf2f0':''}"><div class="value">${x.icon} ${esc(x.title)}</div><div class="smallLabel">${esc(labelKind(x.kind))} · ${esc(x.area)}${x.due?' · '+fmt(x.due):x.periodLabel?' · '+esc(x.periodLabel):''}</div></div>`).join('')}</div>`}
function preview(x){let rows=`<div class="row"><span>Zařadím jako</span><b>${labelKind(x.kind)}</b></div><div class="row"><span>Oblast</span><b>${esc(x.area)}</b></div>`;if(x.due)rows+=`<div class="row"><span>Termín</span><b>${fmt(x.due)}</b></div>`;if(x.periodLabel)rows+=`<div class="row"><span>Období</span><b>${esc(x.periodLabel)}</b></div>`;if(x.expires)rows+=`<div class="row"><span>Platnost</span><b>${fmt(x.expires)}</b></div>`;if(x.value)rows+=`<div class="row"><span>Hodnota</span><b>${x.value.toLocaleString('cs-CZ')} Kč</b></div>`;return `<div class="parse"><h3>✦ Rozumím tomu takto</h3><div class="value">${x.icon} ${esc(x.title)}</div>${rows}</div>`}
function labelKind(k){return({todo:'Udělám',watch:'Hlídám',waiting:'Čekám na',shopping:'Nákup',voucher:'Poukaz'})[k]||k}
const APP_VERSION='0.3.1';
let updateChecking=false;
async function checkForUpdate(){
  if(updateChecking)return;
  updateChecking=true;
  try{
    const u=new URL('index.html',location.href);
    u.searchParams.set('__pd_check',Date.now().toString());
    const r=await fetch(u.toString(),{cache:'no-store'});
    if(!r.ok)return;
    const html=await r.text();
    const m=html.match(/v(\d+\.\d+\.\d+)/);
    const remote=m&&m[1];
    if(remote&&remote!==APP_VERSION){
      const next=new URL('index.html',location.href);
      next.searchParams.set('v',remote);
      next.searchParams.set('__pd_load',Date.now().toString());
      location.replace(next.toString());
    }
  }catch(e){}finally{updateChecking=false}
}
window.addEventListener('pagehide',()=>save());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();else checkForUpdate()});
window.addEventListener('pageshow',()=>checkForUpdate());
if(navigator.storage?.persist){navigator.storage.persist().catch(()=>{})}
render();hydrateStorage();checkForUpdate();</script>
