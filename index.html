  <script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=d=>new Intl.DateTimeFormat('cs-CZ').format(new Date(d));
const dayMs=86400000;
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const state={tab:'today',items:loadLocal(),detail:null,toast:null,undo:null,editing:null,manageMode:false,selectedIds:[],confirmDelete:null,deferFor:null,deferCustom:false,rescheduleFor:null,followup:null,followupCustom:false};
let undoTimer=null;
const DB_NAME='projectD-db-v1', DB_STORE='kv', DB_KEY='items';
function openDB(){return new Promise((resolve,reject)=>{try{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
async function idbGet(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly');const req=tx.objectStore(DB_STORE).get(DB_KEY);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close()})}
async function idbSet(value){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(value,DB_KEY);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function hydrateStorage(){try{const stored=await idbGet();if(Array.isArray(stored)){state.items=stored;try{localStorage.setItem('projectD-items',JSON.stringify(stored))}catch{};render()}else{await idbSet(state.items)}}catch(e){/* fallback to localStorage */}}
function demo(){const now=today0();const add=n=>new Date(now.getTime()+n*dayMs).toISOString();return[
{id:uid(),title:'Zaplatit pojištění auta',kind:'todo',area:'Auto',status:'active',due:add(1),attention:add(0),icon:'🚗',priority:'urgent',created:new Date().toISOString()},
{id:uid(),title:'Zavolat zákazníkovi',kind:'todo',area:'Práce',status:'active',due:add(0),attention:add(0),icon:'📞',priority:'soon',created:new Date().toISOString()},
{id:uid(),title:'Objednat Bena na stříhání',kind:'watch',area:'Ben',status:'active',due:add(9),attention:add(9),icon:'✂️',created:new Date().toISOString()},
{id:uid(),title:'Zubař',kind:'watch',area:'Zdraví',status:'active',due:add(28),attention:add(28),icon:'🦷',created:new Date().toISOString()},
{id:uid(),title:'Servis auta',kind:'waiting',area:'Auto',status:'active',since:add(-4),attention:add(1),icon:'🔧',created:new Date().toISOString()},
{id:uid(),title:'Reklamace sluchátek',kind:'waiting',area:'Osobní',status:'active',since:add(-12),attention:add(2),icon:'🎧',created:new Date().toISOString()},
{id:uid(),title:'Poukaz na masáž',kind:'voucher',area:'Poukazy',status:'active',value:2000,expires:add(25),attention:add(0),icon:'🎁',created:new Date().toISOString()},
]}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem('projectD-items')||'null');return Array.isArray(x)?x:demo()}catch{return demo()}}
function save(){try{localStorage.setItem('projectD-items',JSON.stringify(state.items))}catch{};idbSet(state.items).catch(()=>{})}
function daysBetween(a,b){return Math.ceil((new Date(a)-new Date(b))/dayMs)}
function nextWeekday(text){const now=today0();const days={"pondělí":1,"pondeli":1,"úterý":2,"utery":2,"středu":3,"stredu":3,"středa":3,"čtvrtek":4,"ctvrtek":4,"pátek":5,"patek":5,"pátku":5,"patku":5,"sobotu":6,"sobota":6,"neděli":0,"nedeli":0,"neděle":0};const l=text.toLowerCase();for(const [name,target] of Object.entries(days)){if(new RegExp(`\\b(?:do|v|ve)\\s+${name}\\b`,'i').test(l)){const d=new Date(now);let add=(target-d.getDay()+7)%7;d.setDate(d.getDate()+add);return d}}return null}
function parseDate(text){const now=today0();let d=null;let m=text.match(/za\s+(\d+)\s*(den|dny|dnů|tyden|týden|týdny|týdnů|mesic|měsíc|měsíce|měsíců)/i);if(m){const n=+m[1],u=m[2].toLowerCase();d=new Date(now);if(u.startsWith('den')||u.startsWith('dn'))d.setDate(d.getDate()+n);else if(u.includes('tý')||u.includes('ty'))d.setDate(d.getDate()+7*n);else d.setMonth(d.getMonth()+n);return d}
if(/za\s+p[uů]l\s+roku/i.test(text)){d=new Date(now);d.setMonth(d.getMonth()+6);return d}
m=text.match(/(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);if(m){d=new Date(+m[3],+m[2]-1,+m[1]);return d}
if(/pozítří/i.test(text)){d=new Date(now);d.setDate(d.getDate()+2);return d}
if(/zítra/i.test(text)){d=new Date(now);d.setDate(d.getDate()+1);return d}
if(/\bdnes\b/i.test(text))return new Date(now);
return nextWeekday(text)}
function relativePeriod(text){const now=today0();const l=text.toLowerCase();const months=['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];const monthsGen=['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];
if(/příští\s+týden/.test(l)){const d=new Date(now);let add=(1-d.getDay()+7)%7;if(add===0)add=7;d.setDate(d.getDate()+add);return{date:d,label:'příští týden'}}
if(/příští\s+měsíc/.test(l)){const d=new Date(now.getFullYear(),now.getMonth()+1,1);return{date:d,label:`${months[d.getMonth()]} ${d.getFullYear()}`}}
if(/na\s+konci\s+měsíce/.test(l)){const d=new Date(now.getFullYear(),now.getMonth()+1,0);return{date:d,label:`konec ${monthsGen[d.getMonth()]} ${d.getFullYear()}`}}
return null}
function monthPeriod(text){const forms=[
{m:0,label:'leden',re:/(?:leden|lednu|ledna)/i},{m:1,label:'únor',re:/(?:únor|únoru)/i},{m:2,label:'březen',re:/(?:březen|březnu)/i},{m:3,label:'duben',re:/(?:duben|dubnu)/i},{m:4,label:'květen',re:/(?:květen|květnu)/i},{m:5,label:'červen',re:/(?:červen|červnu)/i},{m:6,label:'červenec',re:/(?:červenec|červenci)/i},{m:7,label:'srpen',re:/(?:srpen|srpnu)/i},{m:8,label:'září',re:/září/i},{m:9,label:'říjen',re:/(?:říjen|říjnu)/i},{m:10,label:'listopad',re:/(?:listopad|listopadu)/i},{m:11,label:'prosinec',re:/(?:prosinec|prosinci)/i}];
const now=today0();for(const x of forms){if(x.re.test(text)){const ym=text.match(/\b(20\d{2})\b/);let y=ym?+ym[1]:now.getFullYear();let d=new Date(y,x.m,1);if(!ym&&d<now)d=new Date(y+1,x.m,1);return{date:d,label:`${x.label} ${d.getFullYear()}`}}}return null}
function seasonPeriod(text){const l=text.toLowerCase();const now=today0();let m=null,label='';if(/na\s+jaře|\bjaro\b/.test(l)){m=2;label='jaro'}else if(/v\s+létě|\bléto\b/.test(l)){m=5;label='léto'}else if(/na\s+podzim|\bpodzim\b/.test(l)){m=8;label='podzim'}else if(/v\s+zimě|\bzima\b/.test(l)){m=11;label='zima'}if(m===null)return null;let y=now.getFullYear();let d=new Date(y,m,1);if(d<now)d=new Date(y+1,m,1);return{date:d,label:`${label} ${d.getFullYear()}`}}
function temporalInfo(text){const exact=parseDate(text);if(exact)return{date:exact,periodLabel:null,exact:true};const rp=relativePeriod(text);if(rp)return{date:rp.date,periodLabel:rp.label,exact:false};const mp=monthPeriod(text);if(mp)return{date:mp.date,periodLabel:mp.label,exact:false};const sp=seasonPeriod(text);if(sp)return{date:sp.date,periodLabel:sp.label,exact:false};return{date:null,periodLabel:null,exact:false}}
function minusMonth(date){const d=new Date(date);const original=d.getDate();d.setMonth(d.getMonth()-1);if(d.getDate()!==original)d.setDate(0);return d}
function money(text){const m=text.match(/(?:za|v hodnotě|hodnota)?\s*(\d[\d\s.]*)\s*(?:kč|korun)/i);return m?parseInt(m[1].replace(/[\s.]/g,''),10):null}
function detectArea(text){const l=text.toLowerCase();
if(/auto|stk|technick|servis\s+auta|pojištěn[ií]\s+auta/.test(l))return'Auto';
if(/smlouv|výpověd|internet|tarif|energie|dodavatel|pojištěn[ií]/.test(l))return'Smlouvy';
if(/rozpočet|spořic|spořen|účet|finance|finanč|investic|hypoték|úvěr|půjčk/.test(l))return'Finance';
if(/topen[ií]|kom[ií]n|kotel|dům|domě|domácnost|revize\s+(?:plynu|elektro)|střecha|okap/.test(l))return'Dům';
if(/rodin|rodič|prarodič|mam|mámě|mamce|mamince|matk|tát|tatín|otc|bratr|brách|brach|sestr|ségř|segr|babičk|\bbabi\b|děd|syn(?:ovi|a|em)?|dcer|dět|partner|manžel|tchyn|tchán|svagr|švagr|švagrov|neteř|synov|strýc|tet(?:a|ě|u|ou)|bratranc|sestřenic|vnuk|vnučk/.test(l))return'Rodina';
if(/kadeř|dovolen|osobn[ií]|pro\s+sebe/.test(l))return'Já';
if(/smlouv|výpověd|internet|tarif|energie|dodavatel/.test(l))return'Smlouvy';

if(/zubař|doktor|lékař|preventiv|ordinac|očkován/.test(l))return'Zdraví';
if(/nabídk|zákazník|firma|práce|kolega|novák/.test(l))return'Práce';
return'Já'}
function detectEntity(text,area){const l=text.toLowerCase();
  if(area==='Rodina'){
    const family=[
      ['Máma',/mam|mámě|mamce|mamince|matk/],['Táta',/tát|tatín|otc/],['Bratr',/bratr|brách|brach/],['Sestra',/sestr|ségř|segr/],
      ['Babička',/babičk|\bbabi\b/],['Děda',/děd/],['Rodiče',/\brodič/],['Prarodiče',/prarodič/],['Syn',/\bsyn(?:ovi|a|em)?\b/],['Dcera',/dcer/],['Děti',/dět/],

function splitInput(text){

  parts.forEach(part=>{
    let p=part.replace(/^a\s+ještě\s+/i,'').replace(/^a\s+/i,'').trim();
    const shop=p.match(/^(?:(?:musím|potřebuji|chci)\s+)?(?:koupit|dokoupit)\s+(.+)$/i);
    if(shop){
      let payload=shop[1].trim();
      let tail='';
      const tm=payload.match(/\s+((?:zítra|dnes|pozítří)(?:\s+(?:ráno|dopoledne|odpoledne|večer))?)$/i);

    const re=new RegExp('\\s+a\\s+(?=(?:'+taskVerbs+')\\b)','i');

  const soon=soonAll.slice(0,4);

  const wait=active.filter(x=>x.kind==='waiting'&&!needIds.has(x.id)&&!soonIds.has(x.id)).slice(0,4);
  const visibleIds=new Set([...needs,...soon,...wait].map(x=>x.id));

    .filter(x=>x.kind!=='shopping'&&!visibleIds.has(x.id)&&!voucherIds.has(x.id))
    .sort((a,b)=>{
      const ta=new Date(a.attention||a.due||a.expires||'2999-12-31').getTime();
      const tb=new Date(b.attention||b.due||b.expires||'2999-12-31').getTime();

function addDaysFrom(base,n){const d=new Date(base||new Date());d.setDate(d.getDate()+n);return d}
function nextSpringFrom(base){const b=new Date(base||new Date());return new Date(b.getFullYear()+1,2,1,12,0,0,0)}
function textOf(x){return `${displayTitle(x)} ${x.raw||''}`.toLowerCase()}
function actionProfile(x){
  const l=textOf(x);
  if(x.kind==='shopping')return{primary:null,secondary:null};
  if(x.kind==='waiting'){
    if(x.area==='Auto'&&/servis/.test(l))return{primary:'Ozvali se',secondary:'Ještě čekám',secondaryMode:'defer'};
    return{primary:'Vyřešeno',secondary:'Ještě čekám',secondaryMode:'defer'};
  }
  if(x.kind==='voucher')return{primary:'Použito',secondary:'Připomenout později',secondaryMode:'defer'};
  if(x.kind==='watch'){
    if(x.area==='Ben'&&/stříh/.test(l))return{primary:'Ostříháno',secondary:'Připomenout později',secondaryMode:'defer'};
    if(x.area==='Ben'&&/očkov/.test(l)&&/objednat/.test(l))return{primary:'Objednáno',secondary:'Připomenout později',secondaryMode:'defer'};
    if(x.area==='Zahrada'&&/levand/.test(l))return{primary:'Hotovo letos',secondary:'Připomenout později',secondaryMode:'defer'};
    if(x.area==='Zahrada')return{primary:'Zkontrolováno',secondary:'Připomenout později',secondaryMode:'defer'};
    if(x.area==='Dům')return{primary:/kontrol/.test(l)?'Zkontrolováno':'Hotovo',secondary:'Připomenout později',secondaryMode:'defer'};
    if(x.area==='Zdraví')return{primary:'Absolvováno',secondary:'Změnit termín',secondaryMode:'reschedule'};
    if(x.area==='Auto'&&(/\bstk\b/.test(l)||/technick/.test(l)))return{primary:'Hotovo',secondary:'Změnit termín',secondaryMode:'reschedule'};
    if(x.area==='Smlouvy')return{primary:'Vyřešeno',secondary:'Změnit připomenutí',secondaryMode:'defer'};
    return{primary:'Vyřešeno',secondary:'Připomenout později',secondaryMode:'defer'};
  }
  if(x.kind==='todo'){
    if(/zavolat|telefon/.test(l))return{primary:'Zavoláno',secondary:'Odložit',secondaryMode:'defer'};
    if(/objednat/.test(l))return{primary:'Objednáno',secondary:'Odložit',secondaryMode:'defer'};
    if(/zaplatit|uhradit/.test(l))return{primary:'Zaplaceno',secondary:'Odložit',secondaryMode:'defer'};
    if(/zkontrolovat/.test(l))return{primary:'Zkontrolováno',secondary:'Odložit',secondaryMode:'defer'};
    return{primary:'Hotovo',secondary:'Odložit',secondaryMode:'defer'};
  }
  return{primary:'Hotovo',secondary:'Připomenout později',secondaryMode:'defer'};
}
function followupProfile(x){
  const l=textOf(x);
  if(x.kind==='voucher'||x.kind==='shopping')return null;
  if(x.kind==='waiting'&&x.area==='Auto'&&/servis/.test(l))return{
    type:'service',
    title:'Je domluvený termín servisu?',
    text:'Když ano, D si pohlídá samotný termín a servis už nezmizí do prázdna.'
  };
  if(x.area==='Ben'&&/stříh/.test(l))return{
    type:'grooming',
    title:'Chceš hlídat další stříhání?',
    text:'Vyber za jak dlouho se ti má připomenout znovu.'
  };
  if(x.area==='Ben'&&/očkov/.test(l)&&/objednat/.test(l))return{
    type:'vaccination',
    title:'Máš už termín očkování?',
    text:'Přidej datum návštěvy a D na něj naváže.'
  };
  if(x.area==='Zdraví'&&(/zubař/.test(l)||/zub.*kontrol/.test(l)||/dent/.test(l)))return{
    type:'dentist',
    title:'Kdy má být další kontrola?',
    text:'Po absolvování si můžeš rovnou založit další kontrolu.'
  };
  if(x.area==='Auto'&&(/\bstk\b/.test(l)||/technick/.test(l)))return{
    type:'stk',
    title:'Pohlídat další STK?',
    text:'U běžného osobního auta bývá další kontrola často za 2 roky. Datum můžeš změnit.'
  };
  if(x.area==='Zahrada')return{
    type:'garden',
    title:'Připomenout to i další sezonu?',
    text:'U sezónních prací dává smysl návaznost na příští rok.'
  };
  if(x.area==='Dům'&&/topen|komín|kotel|reviz|vyčist/.test(l))return{
    type:'annual',
    title:'Pohlídat údržbu znovu?',
    text:'U domácí údržby může D rovnou navázat připomenutím na další rok.'
  };
  if(x.area==='Smlouvy')return{
    type:'contract',
    title:'Má smlouva nový konec?',
    text:'Pokud pokračuje, zadej nové datum a D ji bude dál hlídat.'
  };
  if(x.kind==='watch'&&/pojiště/.test(l))return{
    type:'annual',
    title:'Připomenout znovu za rok?',
    text:'Opakující se věc může pokračovat jako další záznam.'
  };
  return null;
}
function followupDueBase(x){const l=textOf(x);if(x.area==='Ben'&&/stříh/.test(l))return x.completedAt||new Date().toISOString();return x.due||x.expires||x.completedAt||new Date().toISOString()}
function attentionForFollowup(item,date,mode='default'){
  const d=new Date(date);
  if(mode==='service')return addDaysFrom(d,-1).toISOString();
  if(mode==='vaccination')return addDaysFrom(d,-7).toISOString();
  if(item.area==='Smlouvy'||item.area==='Zdraví'||item.area==='Auto')return addMonthsFrom(d,-1).toISOString();
  return d.toISOString();
}
function createFollowup(x,date,opts={}){
  const due=new Date(date).toISOString();
  const kind=opts.kind||x.kind||'watch';
  const area=opts.area||x.area;
  const title=opts.title||displayTitle(x);
  const item={
    id:uid(),title,manualTitle:title,raw:`Návaznost na: ${displayTitle(x)}`,kind,area,entity:opts.entity||x.entity||null,
    icon:iconFor(kind,area),status:'active',created:new Date().toISOString(),
    attention:opts.attention||attentionForFollowup({area},due,opts.mode),due,
    since:null,value:null,expires:null,periodLabel:null,
    parentId:x.id,chainId:x.chainId||x.id,origin:'followup'
  };
  state.items.unshift(item);
  x.followupId=item.id;
  save();
  return item;
}
function startUndo(x,label,pendingFollowup=null){
  state.undo={type:'completion',id:x.id,title:displayTitle(x),label:label||'Hotovo',previousCompletedAt:x._undoPreviousCompletedAt||null,pendingFollowup};
  delete x._undoPreviousCompletedAt;
  if(undoTimer)clearTimeout(undoTimer);
  render();
  undoTimer=setTimeout(()=>{
    const u=state.undo;
    if(!u||u.id!==x.id)return;
    state.undo=null;
    if(u.pendingFollowup){state.followup={sourceId:x.id,...u.pendingFollowup};state.followupCustom=false;render()}
    else render();
  },5000);
}
function completeItem(x){
  const profile=actionProfile(x);
  const fp=followupProfile(x);
  x._undoPreviousCompletedAt=x.completedAt||null;
  x.status='done';x.completedAt=new Date().toISOString();save();
  state.detail=null;state.editing=null;state.followup=null;state.followupCustom=false;
  startUndo(x,profile.primary||'Hotovo',fp?{type:fp.type,title:fp.title,text:fp.text}:null);
}
function postponeToDate(x,date){
  const iso=new Date(date).toISOString();
  x.attention=iso;x.snoozedUntil=iso;save();
  state.deferFor=null;state.deferCustom=false;state.detail=null;
  toast(`Připomenu ${fmt(iso)}.`);
}
function postponeItem(x,days){postponeToDate(x,addDaysFrom(today0(),days))}
function rescheduleItem(x,date){
  const iso=new Date(date).toISOString();x.due=iso;x.periodLabel=null;x.snoozedUntil=null;
  if(x.area==='Zdraví'||x.area==='Auto'||x.area==='Smlouvy')x.attention=addMonthsFrom(iso,-1).toISOString();
  else x.attention=iso;
  save();state.rescheduleFor=null;state.detail=null;toast('Termín upraven.');
}

  if(!state.deferFor)return'';

  if(state.deferCustom)return `<div class="modal" id="modal"><div class="sheet"><h2>Kdy připomenout?</h2><div class="dateChoice"><input type="date" id="deferDate" value="${dateInputValue(x.snoozedUntil||x.attention)}"><button class="green" id="saveDeferDate">Uložit datum</button><button class="secondary" id="cancelDeferDate">Zpět</button></div></div></div>`;
  const waiting=x.kind==='waiting';

function rescheduleModal(){

function render(){let content='';if(state.tab==='today')content=today();if(state.tab==='add')content=add();if(state.tab==='watch')content=listTab('watch','Hlídám','Dlouhodobé věci přehledně na jednom místě.');if(state.tab==='waiting')content=listTab('waiting','Čekám na','Otevřené věci, které nemusíš držet v hlavě.');if(state.tab==='things')content=things();$('#app').innerHTML=`<main class="shell">${content}</main>${nav()}${state.manageMode?`<div class="manageBar"><button class="secondary" id="cancelManage">Zrušit</button><button class="deleteSelected" id="deleteSelected" ${state.selectedIds.length?'':'disabled'}>Smazat vybrané (${state.selectedIds.length})</button></div>`:''}${state.toast?`<div class="toast">${esc(state.toast)}</div>`:''}${state.undo?`<div class="undoToast"><span>${esc(state.undo.title)} · ${esc(state.undo.label||'Hotovo')}</span><button id="undoAction">Vrátit</button></div>`:''}${modal()}`;bind()}

const closeShopping=$('#closeShopping');if(closeShopping)closeShopping.onclick=()=>{state.detail=null;state.editing=null;render()};
const cancelEdit=$('#cancelEdit');if(cancelEdit)cancelEdit.onclick=()=>{state.editing=null;render()};
const saveEdit=$('#saveEdit');if(saveEdit)saveEdit.onclick=()=>{const x=state.items.find(i=>i.id===state.detail);if(!x)return;const title=$('#editTitle').value.trim();if(!title)return toast('Název nemůže být prázdný.');const kind=$('#editKind').value,area=$('#editArea').value,entity=$('#editEntity').value.trim()||null,date=dateFromInput($('#editDate').value),val=parseInt($('#editValue').value||'0',10)||null;x.manualTitle=title;x.title=title;x.kind=kind;x.area=area;x.entity=entity;x.icon=iconFor(kind,area);x.due=null;x.since=null;x.expires=null;x.periodLabel=null;x.snoozedUntil=null;x.value=kind==='voucher'?val:null;if(kind==='shopping'){x.attention=null}else if(kind==='waiting'){x.since=date||new Date().toISOString();x.attention=new Date(new Date(x.since).getTime()+5*dayMs).toISOString()}else if(kind==='voucher'){x.expires=date;x.attention=date?new Date(new Date(date).getTime()-30*dayMs).toISOString():null}else{x.due=date;x.attention=date||(kind==='todo'?new Date().toISOString():null)}save();state.editing=null;toast('Uloženo.');};
const editItem=$('#editItem');if(editItem)editItem.onclick=()=>{state.editing=state.detail;render()};
const finishShopping=id=>{const item=state.items.find(i=>i.id===id);if(!item)return;item.status='done';save();state.undo={type:'shopping',id:item.id,title:displayTitle(item),label:'Koupeno'};if(undoTimer)clearTimeout(undoTimer);const remaining=state.items.some(i=>i.status==='active'&&i.kind==='shopping');if(state.detail==='__shopping__'&&!remaining)state.detail=null;render();undoTimer=setTimeout(()=>{if(state.undo&&state.undo.id===id){state.undo=null;render()}},5000)};
$$('[data-shop-done]').forEach(b=>b.onclick=e=>{e.stopPropagation();finishShopping(b.dataset.shopDone)});
$$('[data-shop-open]').forEach(e=>e.onclick=()=>{state.detail=e.dataset.shopOpen;render()});
const undoAction=$('#undoAction');if(undoAction)undoAction.onclick=()=>{const u=state.undo;if(!u)return;const item=state.items.find(i=>i.id===u.id);if(item){item.status='active';if(u.type==='completion'){item.completedAt=u.previousCompletedAt||null;item.followupId=null}save()}state.undo=null;state.followup=null;state.followupCustom=false;if(undoTimer)clearTimeout(undoTimer);render()};
if(state.detail==='__shopping__')return;
const followSource=state.followup?state.items.find(i=>i.id===state.followup.sourceId):null;
$$('[data-fu-months]').forEach(b=>b.onclick=()=>{if(!followSource)return;const date=addMonthsFrom(followupDueBase(followSource),+b.dataset.fuMonths);createFollowup(followSource,date);state.followup=null;state.followupCustom=false;toast('Navazující připomenutí je nastavené.');});
$$('[data-fu-years]').forEach(b=>b.onclick=()=>{if(!followSource)return;const date=addYearsFrom(followupDueBase(followSource),+b.dataset.fuYears);createFollowup(followSource,date);state.followup=null;state.followupCustom=false;toast('Navazující připomenutí je nastavené.');});
const fuSpring=$('[data-fu-spring]');if(fuSpring)fuSpring.onclick=()=>{if(!followSource)return;const date=nextSpringFrom(followupDueBase(followSource));createFollowup(followSource,date);state.followup=null;toast('Příští sezona je pohlídaná.');};
const fuCustom=$('[data-fu-custom]');if(fuCustom)fuCustom.onclick=()=>{state.followupCustom=true;render()};
const fuNone=$('[data-fu-none]');if(fuNone)fuNone.onclick=()=>{state.followup=null;state.followupCustom=false;toast('Hotovo bez další návaznosti.');};
const cancelFollowupDate=$('#cancelFollowupDate');if(cancelFollowupDate)cancelFollowupDate.onclick=()=>{state.followupCustom=false;render()};
const saveFollowupDate=$('#saveFollowupDate');if(saveFollowupDate)saveFollowupDate.onclick=()=>{if(!followSource)return;const v=$('#followupDate').value;if(!v)return toast('Vyber datum.');const date=dateFromInput(v);let opts={};if(state.followup.type==='service')opts={title:'Servis auta',kind:'watch',area:'Auto',mode:'service'};if(state.followup.type==='vaccination')opts={title:'Očkování Bena',kind:'watch',area:'Ben',mode:'vaccination'};if(state.followup.type==='contract')opts={title:displayTitle(followSource),kind:'watch',area:'Smlouvy'};createFollowup(followSource,date,opts);state.followup=null;state.followupCustom=false;toast('Návaznost je uložená.');};
$$('[data-defer-days]').forEach(b=>b.onclick=()=>{const x=state.items.find(i=>i.id===state.deferFor);if(x)postponeItem(x,+b.dataset.deferDays)});
const deferCustom=$('[data-defer-custom]');if(deferCustom)deferCustom.onclick=()=>{state.deferCustom=true;render()};
const deferCancel=$('[data-defer-cancel]');if(deferCancel)deferCancel.onclick=()=>{state.deferFor=null;state.deferCustom=false;render()};
const cancelDeferDate=$('#cancelDeferDate');if(cancelDeferDate)cancelDeferDate.onclick=()=>{state.deferCustom=false;render()};
const saveDeferDate=$('#saveDeferDate');if(saveDeferDate)saveDeferDate.onclick=()=>{const x=state.items.find(i=>i.id===state.deferFor);const v=$('#deferDate').value;if(!x||!v)return toast('Vyber datum.');postponeToDate(x,dateFromInput(v));};
const cancelRescheduleDate=$('#cancelRescheduleDate');if(cancelRescheduleDate)cancelRescheduleDate.onclick=()=>{state.rescheduleFor=null;render()};
const saveRescheduleDate=$('#saveRescheduleDate');if(saveRescheduleDate)saveRescheduleDate.onclick=()=>{const x=state.items.find(i=>i.id===state.rescheduleFor);const v=$('#rescheduleDate').value;if(!x||!v)return toast('Vyber datum.');rescheduleItem(x,dateFromInput(v));};
const x=state.items.find(i=>i.id===state.detail);if(x){
  const complete=$('#completeAction');if(complete)complete.onclick=()=>completeItem(x);
  const secondary=$('#secondaryAction');if(secondary)secondary.onclick=()=>{const ap=actionProfile(x);if(ap.secondaryMode==='reschedule'){state.rescheduleFor=x.id;state.detail=null;render()}else{state.deferFor=x.id;state.deferCustom=false;state.detail=null;render()}};
  const del=$('#delete');if(del)del.onclick=()=>{state.items=state.items.filter(i=>i.id!==x.id);save();state.detail=null;state.editing=null;toast('Smazáno.');}
}}
function previewMany(xs){if(xs.length===1)return preview(xs[0]);return `<div class="parse"><h3>✦ Našel jsem ${xs.length} věcí</h3>${xs.map((x,i)=>`<div style="padding:${i?'10px 0':'4px 0 10px'};${i?'border-top:1px solid #edf2f0':''}"><div class="value">${x.icon} ${esc(x.title)}</div><div class="smallLabel">${esc(labelKind(x.kind))} · ${esc(areaPath(x))}${x.due?' · '+fmt(x.due):x.periodLabel?' · '+esc(x.periodLabel):''}${x.expires?' · do '+fmt(x.expires):''}${x.value?' · '+x.value.toLocaleString('cs-CZ')+' Kč':''}</div></div>`).join('')}</div>`}
function preview(x){let rows=`<div class="row"><span>Zařadím jako</span><b>${labelKind(x.kind)}</b></div><div class="row"><span>Oblast</span><b>${esc(x.area)}</b></div>${x.entity?`<div class="row"><span>Konkrétně</span><b>${esc(x.entity)}</b></div>`:''}`;if(x.due)rows+=`<div class="row"><span>Termín</span><b>${fmt(x.due)}</b></div>`;if(x.periodLabel)rows+=`<div class="row"><span>Období</span><b>${esc(x.periodLabel)}</b></div>`;if(x.expires)rows+=`<div class="row"><span>Platnost</span><b>${fmt(x.expires)}</b></div>`;if(x.value)rows+=`<div class="row"><span>Hodnota</span><b>${x.value.toLocaleString('cs-CZ')} Kč</b></div>`;return `<div class="parse"><h3>✦ Rozumím tomu takto</h3><div class="value">${x.icon} ${esc(x.title)}</div>${rows}</div>`}
function labelKind(k){return({todo:'Udělám',watch:'Hlídám',waiting:'Čekám na',shopping:'Nákup',voucher:'Poukaz'})[k]||k}
const APP_VERSION='0.3.7';
let updateChecking=false;
async function checkForUpdate(){
  if(updateChecking)return;
  updateChecking=true;
  try{
    const u=new URL('index.html',location.href);
    u.searchParams.set('__pd_check',Date.now().toString());
    const r=await fetch(u.toString(),{cache:'no-store'});
    if(!r.ok)return;
    const html=await r.text();
    const m=html.match(/v(\d+\.\d+\.\d+)/);
    const remote=m&&m[1];
    if(remote&&remote!==APP_VERSION){
      const next=new URL('index.html',location.href);
      next.searchParams.set('v',remote);
      next.searchParams.set('__pd_load',Date.now().toString());
      location.replace(next.toString());
    }
  }catch(e){}finally{updateChecking=false}
}
window.addEventListener('pagehide',()=>save());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();else checkForUpdate()});
window.addEventListener('pageshow',()=>checkForUpdate());
if(navigator.storage?.persist){navigator.storage.persist().catch(()=>{})}
render();hydrateStorage();checkForUpdate();</script>
