<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="D" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>D</title>
  <style>:root{--bg:#f7f9f8;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e5e7eb;--green:#2fa37c;--green2:#e8f7f1;--red:#ef4444;--orange:#f59e0b;--blue:#3b82f6;--shadow:0 10px 30px rgba(15,23,42,.06)}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}.shell{max-width:560px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(92px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{width:42px;height:42px;border-radius:14px;background:var(--green);color:white;font-weight:800;font-size:26px;display:grid;place-items:center;box-shadow:var(--shadow)}
.avatar{width:38px;height:38px;border-radius:50%;background:#e2e8f0;display:grid;place-items:center;font-size:18px}.eyebrow{color:var(--muted);font-size:15px;margin-bottom:6px}.title{font-size:32px;line-height:1.08;margin:0 0 10px;font-weight:800;letter-spacing:-.03em}.subtitle{color:var(--muted);line-height:1.45;margin:0 0 20px}
.section{margin:24px 0 12px}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sectionHead h2{font-size:20px;margin:0}.link{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid #edf0f2;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.item{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:none}.icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#eef2f7;font-size:21px;flex:0 0 auto}.itemMain{flex:1;min-width:0}.itemTitle{font-weight:700;font-size:16px}.itemMeta{color:var(--muted);font-size:13px;margin-top:3px}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;background:var(--green2);color:#157a59;font-size:12px;font-weight:700}.right{color:var(--muted);font-size:18px}.urgent{border-left:4px solid var(--red)}.soon{border-left:4px solid var(--orange)}
.calm{background:linear-gradient(135deg,#eefaf5,#f7fcfa);border:1px solid #d7efe5;border-radius:18px;padding:14px;color:#246b55;margin-top:14px}.calm strong{display:block;color:#195c49;margin-bottom:3px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid #e9ecef;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;z-index:10}.nav button{border:0;background:transparent;color:#64748b;font-size:11px;padding:7px 2px}.nav .active{color:var(--green);font-weight:700}.nav .plus{width:58px;height:58px;margin:-20px auto 0;border-radius:50%;background:var(--green);color:#fff;font-size:30px;box-shadow:0 12px 25px rgba(47,163,124,.3)}.navIcon{font-size:20px;display:block;margin-bottom:2px}
.addGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{border:0;background:#fff;border:1px solid #e8edf0;border-radius:18px;padding:16px;text-align:left;box-shadow:var(--shadow)}.action b{display:block;margin-top:8px}.action small{color:var(--muted)}
textarea{width:100%;min-height:130px;border:1px solid #dfe5e8;border-radius:18px;padding:16px;background:#fff;outline:none;resize:vertical;margin:14px 0}textarea:focus,input:focus{border-color:#8fd4bc;box-shadow:0 0 0 4px rgba(47,163,124,.08)}
.primary{width:100%;border:0;border-radius:17px;background:var(--green);color:white;padding:15px;font-weight:800;font-size:16px;box-shadow:0 8px 20px rgba(47,163,124,.2)}.secondary{border:1px solid #dfe5e8;border-radius:14px;background:#fff;padding:10px 14px;font-weight:700}
.parse{background:linear-gradient(135deg,#f4fffb,#fff);border:1px solid #dcefe7;border-radius:18px;padding:15px;margin:12px 0}.parse h3{margin:0 0 10px;font-size:17px}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #edf2f0;font-size:14px}.row:last-child{border-bottom:0}.row span:first-child{color:var(--muted)}
.search{display:flex;gap:8px;margin:12px 0 18px}.search input{flex:1;border:1px solid #e2e8f0;border-radius:14px;background:#fff;padding:11px 13px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #dfe5e8;border-radius:999px;background:#fff;padding:8px 12px;color:#475569}.chip.active{background:var(--green2);color:#17795a;border-color:#caeadf}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#fff;border:1px solid #edf0f2;border-radius:20px;padding:16px;box-shadow:var(--shadow);min-height:120px}.tileIcon{font-size:25px}.tileTitle{font-weight:800;margin-top:18px}.tileMeta{color:var(--muted);font-size:13px;margin-top:4px}.voucherSummary{background:linear-gradient(135deg,#fff8e8,#fff);border:1px solid #f4e7bd;border-radius:20px;padding:16px;margin-bottom:14px}.voucherSummary .big{font-size:28px;font-weight:800;margin-top:4px}.empty{color:var(--muted);text-align:center;padding:36px 20px}.toast{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:10px 14px;border-radius:999px;font-size:14px;z-index:20;box-shadow:var(--shadow)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.35);display:flex;align-items:flex-end;justify-content:center;z-index:30}.sheet{background:#fff;width:min(560px,100%);border-radius:26px 26px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom));max-height:86dvh;overflow:auto}.sheet h2{margin:0 0 6px}.sheet .meta{color:var(--muted);margin-bottom:18px}.sheetActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.danger{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}.green{background:var(--green);color:#fff;border:0}.sheet button{border-radius:14px;padding:12px;font-weight:800}
.smallLabel{font-size:12px;color:var(--muted);margin-top:6px}.value{font-weight:800}.hidden{display:none!important}
@media (min-width:700px){.shell{padding-top:34px}.nav{border-radius:22px 22px 0 0}}
</style>
</head>
<body>
  <div id="app"></div>
  <script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=d=>new Intl.DateTimeFormat('cs-CZ').format(new Date(d));
const dayMs=86400000;
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const state={tab:'today',items:loadLocal(),detail:null,toast:null};
const DB_NAME='projectD-db-v1', DB_STORE='kv', DB_KEY='items';
function openDB(){return new Promise((resolve,reject)=>{try{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
async function idbGet(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly');const req=tx.objectStore(DB_STORE).get(DB_KEY);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close()})}
async function idbSet(value){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(value,DB_KEY);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function hydrateStorage(){try{const stored=await idbGet();if(Array.isArray(stored)){state.items=stored;try{localStorage.setItem('projectD-items',JSON.stringify(stored))}catch{};render()}else{await idbSet(state.items)}}catch(e){/* fallback to localStorage */}}
function demo(){const now=today0();const add=n=>new Date(now.getTime()+n*dayMs).toISOString();return[
{id:uid(),title:'Zaplatit pojištění auta',kind:'todo',area:'Auto',status:'active',due:add(1),attention:add(0),icon:'🚗',priority:'urgent',created:new Date().toISOString()},
{id:uid(),title:'Zavolat zákazníkovi',kind:'todo',area:'Práce',status:'active',due:add(0),attention:add(0),icon:'📞',priority:'soon',created:new Date().toISOString()},
{id:uid(),title:'Objednat Bena na stříhání',kind:'watch',area:'Ben',status:'active',due:add(9),attention:add(9),icon:'✂️',created:new Date().toISOString()},
{id:uid(),title:'Zubař',kind:'watch',area:'Zdraví',status:'active',due:add(28),attention:add(28),icon:'🦷',created:new Date().toISOString()},
{id:uid(),title:'Servis auta',kind:'waiting',area:'Auto',status:'active',since:add(-4),attention:add(1),icon:'🔧',created:new Date().toISOString()},
{id:uid(),title:'Reklamace sluchátek',kind:'waiting',area:'Osobní',status:'active',since:add(-12),attention:add(2),icon:'🎧',created:new Date().toISOString()},
{id:uid(),title:'Poukaz na masáž',kind:'voucher',area:'Poukazy',status:'active',value:2000,expires:add(25),attention:add(0),icon:'🎁',created:new Date().toISOString()},
]}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem('projectD-items')||'null');return Array.isArray(x)?x:demo()}catch{return demo()}}
function save(){try{localStorage.setItem('projectD-items',JSON.stringify(state.items))}catch{};idbSet(state.items).catch(()=>{})}
function daysBetween(a,b){return Math.ceil((new Date(a)-new Date(b))/dayMs)}
function parseDate(text){const now=today0();let d=null;let m=text.match(/za\s+(\d+)\s*(den|dny|dnů|tyden|týden|týdny|týdnů|mesic|měsíc|měsíce|měsíců)/i);if(m){const n=+m[1],u=m[2].toLowerCase();d=new Date(now);if(u.startsWith('den')||u.startsWith('dn'))d.setDate(d.getDate()+n);else if(u.includes('tý')||u.includes('ty'))d.setDate(d.getDate()+7*n);else d.setMonth(d.getMonth()+n);return d}
if(/za\s+p[uů]l\s+roku/i.test(text)){d=new Date(now);d.setMonth(d.getMonth()+6);return d}
m=text.match(/(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);if(m){d=new Date(+m[3],+m[2]-1,+m[1]);return d}
if(/zítra/i.test(text)){d=new Date(now);d.setDate(d.getDate()+1);return d}
return null}
function money(text){const m=text.match(/(?:za|v hodnotě|hodnota)?\s*(\d[\d\s.]*)\s*(?:kč|korun)/i);return m?parseInt(m[1].replace(/[\s.]/g,''),10):null}
function cleanTitle(text,kind){let t=text.trim().replace(/^[-–—\s]+/,'');
if(kind==='waiting')t=t.replace(/^čekám(?:\s+na)?\s*/i,'').replace(/^až\s*/i,'');
if(kind==='shopping')t=t.replace(/^(vzal jsem poslední|došla|dochází|musím koupit|koupit|dokoupit)\s*/i,'');
if(kind==='voucher')t=t.replace(/^(mám|dostal jsem|dostala jsem)\s*/i,'');
return t.charAt(0).toUpperCase()+t.slice(1)}
function parse(text){const l=text.toLowerCase();let kind='todo',area='Osobní',icon='📝',attention=null,due=null,since=null,value=null,expires=null;
if(/čekám|až mi|až se ozve|odpověď/.test(l)){kind='waiting';since=new Date().toISOString();attention=new Date(Date.now()+5*dayMs).toISOString();icon='⏳'}
if(/poukaz|voucher|dárkov(á|y) karta|kredit/.test(l)){kind='voucher';area='Poukazy';icon='🎁';value=money(text);expires=parseDate(text)?.toISOString()||null;if(expires){attention=new Date(new Date(expires).getTime()-30*dayMs).toISOString()}}
else if(/mouka|mléko|granul|tablety do myčky|toalet|koupit|dokoupit|došla|dochází|poslední/.test(l)){kind='shopping';area=/hnojiv|zahrad|trávník/.test(l)?'Zahrada':'Domácnost';icon='🛒';attention=new Date().toISOString()}
else if(/zubař|doktor|kontrol|preventiv/.test(l)){kind='watch';area='Zdraví';icon='🦷';due=parseDate(text)?.toISOString()||null;attention=due?new Date(new Date(due).getTime()-30*dayMs).toISOString():null}
else if(/stříh|veterin|ben|pes/.test(l)){kind='watch';area='Ben';icon='🐾';due=parseDate(text)?.toISOString()||null;attention=due?new Date(new Date(due).getTime()-14*dayMs).toISOString():null}
else if(/smlouv|pojiště|stk|technick/.test(l)){kind='watch';area=/smlouv/.test(l)?'Smlouvy':'Auto';icon=/auto|stk|technick/.test(l)?'🚗':'📄';due=parseDate(text)?.toISOString()||null;attention=due?new Date(new Date(due).getTime()-30*dayMs).toISOString():null}
else if(/zahrad|strom|jablo|levand|trávník|hnojiv/.test(l)){kind='watch';area='Zahrada';icon='🌿';due=parseDate(text)?.toISOString()||null;attention=due||null}
else {due=parseDate(text)?.toISOString()||null;attention=due||new Date().toISOString();if(/nabídk|zákazník|firma|práce|kolega|novák/.test(l)){area='Práce';icon='💼'}}
return{id:uid(),title:cleanTitle(text,kind),raw:text,kind,area,icon,status:'active',created:new Date().toISOString(),attention,due,since,value,expires}}
function splitInput(text){
  const source=String(text||'').replace(/\r/g,'\n').trim();
  if(!source)return[];
  const parts=source.split(/(?:[.!?;]+|\n+)/).map(s=>s.trim()).filter(Boolean);
  const out=[];
  const taskVerbs='zavolat|zařídit|objednat|vyzvednout|poslat|napsat|zaplatit|ověřit|zkontrolovat|rezervovat|přihlásit|odvézt|přivézt|koupit|dokoupit';
  parts.forEach(part=>{
    let p=part.replace(/^a\s+ještě\s+/i,'').replace(/^a\s+/i,'').trim();
    const shop=p.match(/^(?:(?:musím|potřebuji|chci)\s+)?(?:koupit|dokoupit)\s+(.+)$/i);
    if(shop){
      let payload=shop[1].trim();
      let tail='';
      const tm=payload.match(/\s+((?:zítra|dnes|pozítří)(?:\s+(?:ráno|dopoledne|odpoledne|večer))?)$/i);
      if(tm){tail=' '+tm[1];payload=payload.slice(0,tm.index).trim()}
      const items=payload.split(/\s*,\s*|\s+a\s+/i).map(x=>x.trim()).filter(Boolean);
      if(items.length>1){items.forEach(x=>out.push('Koupit '+x+tail));return}
    }
    const re=new RegExp('\\s+a\\s+(?=(?:'+taskVerbs+')\\b)','i');
    const tasks=p.split(re).map(x=>x.trim()).filter(Boolean);
    if(tasks.length>1){tasks.forEach(x=>out.push(x));return}
    out.push(p);
  });
  return out;
}
function parseMany(text){return splitInput(text).map(parse)}
function toast(t){state.toast=t;render();setTimeout(()=>{state.toast=null;render()},1700)}
function nav(){return `<nav class="nav">${[['today','⌂','Dnes'],['watch','☷','Hlídám']].map(([id,i,l])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}"><span class="navIcon">${i}</span>${l}</button>`).join('')}<button class="plus" data-tab="add">＋</button>${[['waiting','◷','Čekám'],['things','▣','Moje věci']].map(([id,i,l])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}"><span class="navIcon">${i}</span>${l}</button>`).join('')}</nav>`}
function header(){return `<div class="top"><div style="display:flex;align-items:center;gap:8px"><div class="brand">D</div><span style="font-size:11px;color:#94a3b8;font-weight:700">v0.2.4</span></div><div class="avatar">☺</div></div>`}
function itemHtml(x,klass=''){let meta='';if(x.kind==='waiting'&&x.since)meta=`čekáš ${Math.max(0,daysBetween(new Date(),x.since))} dní`;else if(x.kind==='voucher'&&x.expires)meta=`${x.value?x.value.toLocaleString('cs-CZ')+' Kč · ':''}platí do ${fmt(x.expires)}`;else if(x.due)meta=`${new Date(x.due)<=new Date(Date.now()+dayMs)?'do ':''}${fmt(x.due)}`;else meta=x.area;return `<div class="item ${klass}" data-id="${x.id}"><div class="icon">${x.icon||'•'}</div><div class="itemMain"><div class="itemTitle">${esc(x.title)}</div><div class="itemMeta">${esc(meta)}</div></div><div class="right">›</div></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function today(){const now=today0();const active=state.items.filter(x=>x.status==='active');const needs=active.filter(x=>x.attention&&new Date(x.attention)<=new Date(now.getTime()+dayMs));const soon=active.filter(x=>x.attention&&new Date(x.attention)>new Date(now.getTime()+dayMs)&&new Date(x.attention)<=new Date(now.getTime()+30*dayMs)).slice(0,4);const wait=active.filter(x=>x.kind==='waiting').slice(0,4);const vouchers=active.filter(x=>x.kind==='voucher');const value=vouchers.reduce((s,x)=>s+(x.value||0),0);
return `${header()}<div class="eyebrow">Dobré ráno</div><h1 class="title">Dnes potřebují tvoji pozornost ${needs.length===1?'1 věc':needs.length+' věci'}.</h1>${needs.length?`<div class="card">${needs.map((x,i)=>itemHtml(x,i===0&&x.priority==='urgent'?'urgent':x.priority==='soon'?'soon':'')).join('')}</div>`:`<div class="calm"><strong>Dnes nic nehoří.</strong>Můžeš nechat hlavu chvíli vypnutou.</div>`}${soon.length?`<div class="section"><div class="sectionHead"><h2>Brzy</h2></div><div class="card">${soon.map(x=>itemHtml(x)).join('')}</div></div>`:''}${wait.length?`<div class="section"><div class="sectionHead"><h2>Čekám na</h2></div><div class="card">${wait.map(x=>itemHtml(x)).join('')}</div></div>`:''}${vouchers.length?`<div class="section"><div class="voucherSummary"><div class="smallLabel">Aktivní poukazy</div><div class="big">${vouchers.length} · ${value.toLocaleString('cs-CZ')} Kč</div><div class="smallLabel">Hlídám, aby nic nepropadlo.</div></div></div>`:''}<div class="calm"><strong>${Math.max(0,active.length-needs.length)} dalších věcí hlídám.</strong>Dnes je řešit nemusíš.</div>`}
function add(){return `${header()}<h1 class="title">Přidat</h1><p class="subtitle">Co nechceš držet v hlavě?</p><div class="addGrid"><button class="action"><span style="font-size:24px">🎙️</span><b>Říct</b><small>později hlasem</small></button><button class="action"><span style="font-size:24px">📷</span><b>Vyfotit</b><small>foto a účtenky</small></button><button class="action"><span style="font-size:24px">📄</span><b>Dokument</b><small>PDF a smlouvy</small></button><button class="action"><span style="font-size:24px">✍️</span><b>Napsat</b><small>funguje už teď</small></button></div><textarea id="newText" placeholder="Např. Koupit mouku, mléko a granule. Zavolat Novákovi a zařídit STK."></textarea><div id="preview"></div><button class="primary" id="saveItem">Uložit</button><div class="smallLabel" style="text-align:center;margin-top:10px">Tohle už nemusíš držet v hlavě.</div>`}
function listTab(kind,title,sub){let arr=state.items.filter(x=>x.status==='active'&&(kind==='watch'?x.kind!=='waiting'&&x.kind!=='shopping':x.kind===kind));return `${header()}<h1 class="title">${title}</h1><p class="subtitle">${sub}</p><div class="search"><input id="search" placeholder="Hledat…"><button class="secondary">Vše</button></div><div id="list">${arr.length?`<div class="card">${arr.map(x=>itemHtml(x)).join('')}</div>`:`<div class="empty">Zatím je tu prázdno.</div>`}</div>`}
function things(){const active=state.items.filter(x=>x.status==='active');const areas=['Já','Rodina','Ben','Auto','Dům','Smlouvy','Práce','Finance','Domácnost','Zahrada','Poukazy'];const icons={'Já':'👤','Rodina':'👨‍👩‍👧','Ben':'🐾','Auto':'🚗','Dům':'🏠','Smlouvy':'📄','Práce':'💼','Finance':'📈','Domácnost':'🛒','Zahrada':'🌿','Poukazy':'🎁'};return `${header()}<h1 class="title">Moje věci</h1><p class="subtitle">Lidé, zvířata, auta, domov i práce.</p><div class="grid">${areas.map(a=>{const n=active.filter(x=>x.area===a).length;return `<div class="tile" data-area="${a}"><div class="tileIcon">${icons[a]}</div><div class="tileTitle">${a}</div><div class="tileMeta">${n} aktivních věcí</div></div>`}).join('')}</div>`}
function modal(){const x=state.items.find(i=>i.id===state.detail);if(!x)return'';return `<div class="modal" id="modal"><div class="sheet"><h2>${x.icon||''} ${esc(x.title)}</h2><div class="meta">${esc(x.area)} · ${x.status==='active'?'aktivní':'hotovo'}</div>${x.due?`<div class="row"><span>Termín</span><b>${fmt(x.due)}</b></div>`:''}${x.expires?`<div class="row"><span>Platnost</span><b>${fmt(x.expires)}</b></div>`:''}${x.value?`<div class="row"><span>Hodnota</span><b>${x.value.toLocaleString('cs-CZ')} Kč</b></div>`:''}${x.since?`<div class="row"><span>Čekám od</span><b>${fmt(x.since)}</b></div>`:''}<div class="row"><span>Zdroj</span><b>${x.raw?'Textová poznámka':'Ruční záznam'}</b></div><div class="sheetActions"><button id="tomorrow">Zítra</button><button id="done" class="green">${x.status==='active'?'Hotovo':'Znovu otevřít'}</button><button id="delete" class="danger" style="grid-column:1/3">Smazat</button></div></div></div>`}
function render(){let content='';if(state.tab==='today')content=today();if(state.tab==='add')content=add();if(state.tab==='watch')content=listTab('watch','Hlídám','Dlouhodobé věci přehledně na jednom místě.');if(state.tab==='waiting')content=listTab('waiting','Čekám na','Otevřené věci, které nemusíš držet v hlavě.');if(state.tab==='things')content=things();$('#app').innerHTML=`<main class="shell">${content}</main>${nav()}${state.toast?`<div class="toast">${esc(state.toast)}</div>`:''}${modal()}`;bind()}
function bind(){$$('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.detail=null;render()});$$('[data-id]').forEach(e=>e.onclick=()=>{state.detail=e.dataset.id;render()});$$('[data-area]').forEach(e=>e.onclick=()=>{const a=e.dataset.area;const arr=state.items.filter(x=>x.status==='active'&&x.area===a);$('.shell').innerHTML=`${header()}<button class="secondary" id="backThings">← Zpět</button><h1 class="title" style="margin-top:18px">${a}</h1>${arr.length?`<div class="card">${arr.map(x=>itemHtml(x)).join('')}</div>`:`<div class="empty">Zatím nic.</div>`}`;$('#backThings').onclick=()=>render();$$('[data-id]').forEach(i=>i.onclick=()=>{state.detail=i.dataset.id;render()})});
const ta=$('#newText');if(ta){ta.oninput=()=>{const t=ta.value.trim();const xs=t?parseMany(t):[];$('#preview').innerHTML=xs.length?previewMany(xs):''}}
const saveB=$('#saveItem');if(saveB)saveB.onclick=()=>{const t=$('#newText').value.trim();if(!t)return toast('Napiš nejdřív jednu nebo více věcí.');const xs=parseMany(t);if(!xs.length)return toast('Nenašel jsem nic k uložení.');state.items.unshift(...xs);save();state.tab='today';toast(xs.length===1?'Mám to.':'Mám '+xs.length+' věcí.');}
const search=$('#search');if(search)search.oninput=()=>{const q=search.value.toLowerCase();$$('#list .item').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?'flex':'none')};
const modalEl=$('#modal');if(modalEl)modalEl.onclick=e=>{if(e.target===modalEl){state.detail=null;render()}};const x=state.items.find(i=>i.id===state.detail);if(x){const done=$('#done');if(done)done.onclick=()=>{x.status=x.status==='active'?'done':'active';save();state.detail=null;toast(x.status==='done'?'Hotovo.':'Znovu hlídám.');};const tomorrow=$('#tomorrow');if(tomorrow)tomorrow.onclick=()=>{x.attention=new Date(today0().getTime()+dayMs).toISOString();save();state.detail=null;toast('Vrátím ti to zítra.');};const del=$('#delete');if(del)del.onclick=()=>{state.items=state.items.filter(i=>i.id!==x.id);save();state.detail=null;toast('Smazáno.');}}}
function previewMany(xs){if(xs.length===1)return preview(xs[0]);return `<div class="parse"><h3>✦ Našel jsem ${xs.length} věcí</h3>${xs.map((x,i)=>`<div style="padding:${i?'10px 0':'4px 0 10px'};${i?'border-top:1px solid #edf2f0':''}"><div class="value">${x.icon} ${esc(x.title)}</div><div class="smallLabel">${esc(labelKind(x.kind))} · ${esc(x.area)}${x.due?' · '+fmt(x.due):''}</div></div>`).join('')}</div>`}
function preview(x){let rows=`<div class="row"><span>Zařadím jako</span><b>${labelKind(x.kind)}</b></div><div class="row"><span>Oblast</span><b>${esc(x.area)}</b></div>`;if(x.due)rows+=`<div class="row"><span>Termín</span><b>${fmt(x.due)}</b></div>`;if(x.expires)rows+=`<div class="row"><span>Platnost</span><b>${fmt(x.expires)}</b></div>`;if(x.value)rows+=`<div class="row"><span>Hodnota</span><b>${x.value.toLocaleString('cs-CZ')} Kč</b></div>`;return `<div class="parse"><h3>✦ Rozumím tomu takto</h3><div class="value">${x.icon} ${esc(x.title)}</div>${rows}</div>`}
function labelKind(k){return({todo:'Udělám',watch:'Hlídám',waiting:'Čekám na',shopping:'Doplnit',voucher:'Poukaz'})[k]||k}
window.addEventListener('pagehide',()=>save());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
if(navigator.storage?.persist){navigator.storage.persist().catch(()=>{})}
render();hydrateStorage();</script>
</body>
</html>
